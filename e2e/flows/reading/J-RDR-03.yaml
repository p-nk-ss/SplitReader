appId: ${APP_ID}
name: J-RDR-03 Rotation and resume - the paragraph never moves
tags: [smoke, full, rotation, phone, tablet, reading, J-RDR-03]
# books: en-novel.epub
---
# J-RDR-03 — Rotation and resume: the paragraph never moves.
# Fixture: en-novel.epub (F-LONG, "The River Crossing": 22 chapters; chapter 8 has 8 paragraphs
# marked "(ch8.1)" … "(ch8.8)"). Ids: original_<chapter>_<paragraph>, both 0-based.
# Runs on the phone and on the tablet. e2e/run.sh passes DEVICE_CLASS (phone | tablet); the steps
# that only a phone can show (the Landscape lock turning the screen, stacked panes) sit behind
# `when: true: ${DEVICE_CLASS == 'phone'}`. Run by hand, add `-e DEVICE_CLASS=phone|tablet`.
#
# "Where the reader is" is never guessed from swipe distances. The setup bookmarks the page it
# scrolled to, reads the paragraph number N from the bookmark's label ("Chapter 8 · ¶ N") and
# jumps to that bookmark, which puts paragraph N exactly on top. From then on:
#   output.p    = N - 1   -> original_7_${output.p} must be on screen,
#   output.prev = N - 2   -> original_7_${output.prev}, the paragraph before it, must not be.
# Limit: Maestro sees which paragraph is on top, not how many pixels of it are scrolled off, so
# the "same pixel offset" half of POS-013 stays a visual check (manual journey J-RDR-11).
#
# setOrientation names are relative to the device's natural orientation, which is portrait on the
# phone and landscape on the tablet: LANDSCAPE_LEFT is "the other way up" on both, PORTRAIT is
# "the way it started".
# That the screen really turned is asserted through the paragraph's width (Maestro takes `width:`
# only as a literal, hence the two `when:` blocks per check; device px of Pixel_10_Pro and
# Tab_35_PixelTablet at the default 32 dp margin):
#                          natural            turned (LANDSCAPE_LEFT)
#   phone,  two panes      1088 (stacked)     1218 (side by side)
#   phone,  one column     1088               2508
#   tablet, two panes      1192               712
#   tablet, one column     2432               1472
# A turn that did not happen leaves the other column's number on screen and fails the check.
# Source of steps/checkpoints: docs/e2e/e2e_journeys.md J-RDR-03.
# No step may be skipped for a device class this flow does not know (run.sh passes phone | tablet).
- assertTrue: ${DEVICE_CLASS == 'phone' || DEVICE_CLASS == 'tablet'}
- runFlow: ../../subflows/launch_clean.yaml

# Preconditions: F-LONG with saved progress in the middle of chapter 8; the portrait hint
# suppressed (import_book ticks "Don't show again"); the Offline HQ pack already downloaded.
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "en-novel.epub"
      TITLE: "The River Crossing"
      FIRST_TEXT: "The old mill still stood at the bend of the river"
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:chaptersButton"
      OPENS: "Chapters"
- tapOn:
    id: "reader:chapterRow:7"
- extendedWaitUntil:
    notVisible: "Chapters"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*\\(ch8\\.1\\).*"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "translation_7_0"
    timeout: 240000
# Into the chapter: until its first paragraph is off screen, and one swipe more (the gap under a
# paragraph that has just left still counts as that paragraph). Chapter 8 has 8 paragraphs, so
# this stops well inside it.
- repeat:
    times: 40
    while:
      visible:
        id: "original_7_0"
    commands:
      - swipe:
          start: "30%, 40%"
          end: "30%, 30%"
          duration: 800
- swipe:
    start: "30%, 40%"
    end: "30%, 30%"
    duration: 800
- assertNotVisible:
    id: "original_7_0"
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: "Bookmark this page"
- tapOn: "Bookmark this page"
- extendedWaitUntil:
    visible: "Chapter 8 · ¶ \\d+"
    timeout: 5000
- copyTextFrom: "Chapter 8 · ¶ \\d+"
- evalScript: ${output.p = parseInt(maestro.copiedText.split('¶ ')[1]) - 1}
- evalScript: ${output.prev = output.p - 1}
# Mid-chapter: not the first paragraph (there must be a paragraph before it to check against).
- assertTrue: ${output.p >= 1}
- tapOn: "Chapter 8 · ¶ \\d+"
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 15000
- assertNotVisible:
    id: "original_7_${output.prev}"
- runFlow: ../../subflows/leave_reader.yaml

# 1. Settings -> Orientation -> three options Auto / Landscape / Portrait, in English (APP-024)
- tapOn: "Settings"
- scrollUntilVisible:
    element: "LANDSCAPE"
    direction: DOWN
    timeout: 40000
- assertVisible: "Screen orientation"
- assertVisible: "AUTO"
- assertVisible: "LANDSCAPE"
- assertVisible: "PORTRAIT"

# 2. Phone: select Landscape without restarting -> the app turns to landscape at once (APP-022):
#    the navigation becomes the side rail (its items one under another) instead of the bottom
#    bar (its items side by side).
# 3. Phone: kill the app and relaunch -> still landscape, not reset to the phone's default
#    Portrait (APP-023).
#    On a tablet Landscape is the default and nothing would turn; that half is manual (J-RDR-12).
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'phone'}
    commands:
      - assertVisible:
          text: "Catalog"
          rightOf: "Library"
      - tapOn: "LANDSCAPE"
      - extendedWaitUntil:
          notVisible:
            text: "Catalog"
            rightOf: "Library"
          timeout: 10000
      - assertVisible: "Catalog"
      - assertVisible: "Library"
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "Open book"
          timeout: 45000
      - assertVisible: "Catalog"
      - assertNotVisible:
          text: "Catalog"
          rightOf: "Library"
      - tapOn: "Settings"
      - scrollUntilVisible:
          element: "AUTO"
          direction: DOWN
          timeout: 40000

#    Select Auto (both devices), so the device may be turned.
- tapOn: "AUTO"
- setOrientation: PORTRAIT
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'phone'}
    commands:
      - extendedWaitUntil:
          visible:
            text: "Catalog"
            rightOf: "Library"
          timeout: 10000

# 4. Library -> "Continue reading" -> the book opens at the saved paragraph, the same as
#    reopening it from its card (POS-016)
- tapOn: "Library"
- scrollUntilVisible:
    element: "CONTINUE READING"
    direction: UP
    timeout: 10000
- tapOn: "CONTINUE READING"
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 20000
- assertNotVisible:
    id: "original_7_${output.prev}"

# 5. Turn the device -> the same paragraph is on top (NAV-001)
# 6. Turn it back; repeat three times -> the same paragraph every time, never the start of the
#    book (NAV-001). On the phone the layout follows: side by side when landscape, stacked when
#    portrait.
- repeat:
    times: 4
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - extendedWaitUntil:
          visible:
            id: "original_7_${output.p}"
          timeout: 15000
      - assertNotVisible:
          id: "original_7_${output.prev}"
      - assertNotVisible: ".*downstream\\. \\(1\\).*"
      # …and the screen did turn: the paragraph has the turned layout's width.
      - runFlow:
          when:
            true: ${DEVICE_CLASS == 'phone'}
          commands:
            - assertVisible:
                id: "original_7_${output.p}"
                width: 1218
                tolerance: 6
      - runFlow:
          when:
            true: ${DEVICE_CLASS == 'tablet'}
          commands:
            - assertVisible:
                id: "original_7_${output.p}"
                width: 712
                tolerance: 6
      - runFlow:
          when:
            true: ${DEVICE_CLASS == 'phone'}
          commands:
            - assertNotVisible:
                id: "reader:verticalTopPane"
      - setOrientation: PORTRAIT
      - extendedWaitUntil:
          visible:
            id: "original_7_${output.p}"
          timeout: 15000
      - assertNotVisible:
          id: "original_7_${output.prev}"
      - assertNotVisible: ".*downstream\\. \\(1\\).*"
      # …and it turned back.
      - runFlow:
          when:
            true: ${DEVICE_CLASS == 'phone'}
          commands:
            - assertVisible:
                id: "original_7_${output.p}"
                width: 1088
                tolerance: 6
      - runFlow:
          when:
            true: ${DEVICE_CLASS == 'tablet'}
          commands:
            - assertVisible:
                id: "original_7_${output.p}"
                width: 1192
                tolerance: 6
      - runFlow:
          when:
            true: ${DEVICE_CLASS == 'phone'}
          commands:
            - assertVisible:
                id: "reader:verticalTopPane"
- takeScreenshot: J-RDR-03-step6-after-rotations

# 6a. Aa -> "Show translation" off; turn the device and turn it back -> one original-only
#     column both ways, the same paragraph on top; Aa still shows "Show translation" off
#     (LAY-028). Turn it back on.
#     The switch has no label of its own: it is the checkable node in the "Show translation" row.
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:displaySettingsButton"
      OPENS: "Display"
- scrollUntilVisible:
    element: "Show illustrations"
    direction: DOWN
    timeout: 15000
- assertVisible:
    checked: true
    below: "Show translation"
    above: "Hide to read original only"
    rightOf: "Show translation"
- tapOn:
    below: "Show translation"
    above: "Hide to read original only"
    rightOf: "Show translation"
- assertNotVisible:
    checked: true
    below: "Show translation"
    above: "Hide to read original only"
    rightOf: "Show translation"
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Display"
    timeout: 5000
- assertVisible:
    id: "original_7_${output.p}"
- assertNotVisible:
    id: "translation_7_.*"
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 15000
- assertNotVisible:
    id: "original_7_${output.prev}"
- assertNotVisible:
    id: "translation_7_.*"
- assertNotVisible:
    id: "reader:verticalBottomPane"
#     …turned, and one column: the paragraph spans the turned screen.
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'phone'}
    commands:
      - assertVisible:
          id: "original_7_${output.p}"
          width: 2508
          tolerance: 6
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'tablet'}
    commands:
      - assertVisible:
          id: "original_7_${output.p}"
          width: 1472
          tolerance: 6
- takeScreenshot: J-RDR-03-step6a-turned-one-column
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 15000
- assertNotVisible:
    id: "original_7_${output.prev}"
- assertNotVisible:
    id: "translation_7_.*"
- assertNotVisible:
    id: "reader:verticalBottomPane"
#     …turned back, still one column.
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'phone'}
    commands:
      - assertVisible:
          id: "original_7_${output.p}"
          width: 1088
          tolerance: 6
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'tablet'}
    commands:
      - assertVisible:
          id: "original_7_${output.p}"
          width: 2432
          tolerance: 6
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:displaySettingsButton"
      OPENS: "Display"
- scrollUntilVisible:
    element: "Show illustrations"
    direction: DOWN
    timeout: 15000
- assertVisible: "Show translation"
- assertNotVisible:
    checked: true
    below: "Show translation"
    above: "Hide to read original only"
    rightOf: "Show translation"
- tapOn:
    below: "Show translation"
    above: "Hide to read original only"
    rightOf: "Show translation"
# With the translation back, the tablet's dialog gets its "Split position" row again, above this
# one: the row moves down and can leave the screen (seen on Tab_35_PixelTablet). Scroll to it.
- scrollUntilVisible:
    element: "Show illustrations"
    direction: DOWN
    timeout: 15000
- assertVisible:
    checked: true
    below: "Show translation"
    above: "Hide to read original only"
    rightOf: "Show translation"
- tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "translation_7_${output.p}"
    timeout: 60000

# 7. Back to Library; reopen the book from its card -> the same paragraph (NAV-002)
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 20000
- assertNotVisible:
    id: "original_7_${output.prev}"

# 8. Chapter picker -> chapter 10, so the first row on screen is a chapter title; Back; reopen
#    -> the place is chapter 10's first paragraph, from its first line: it is on top, the chapter
#    title is above the screen and nothing of chapter 9 shows (POS-013)
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:chaptersButton"
      OPENS: "Chapters"
- tapOn:
    id: "reader:chapterRow:9"
- extendedWaitUntil:
    notVisible: "Chapters"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*\\(ch10\\.1\\).*"
    timeout: 15000
- assertVisible: "— 10 —"
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_9_0"
    timeout: 20000
- assertNotVisible:
    id: "original_8_.*"
- assertNotVisible: "— 10 —"
- takeScreenshot: J-RDR-03-step8-reopened-at-chapter-title

# 9. Bookmarks -> the chapter 8 bookmark (its paragraph exactly on top), then scroll a little so
#    its first lines are off screen; Back; reopen -> the same paragraph is on top (POS-013)
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: "Chapter 8 · ¶ \\d+"
- tapOn: "Chapter 8 · ¶ \\d+"
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 15000
- assertNotVisible:
    id: "original_7_${output.prev}"
# 3% of the screen (48 px on the tablet, 85 px on the phone) is past the touch slop, so the page
# does move; Maestro cannot read by how much, so that it moved is NOT asserted — the two
# screenshots of this step show it, and the pixel offset is the manual J-RDR-11.
- swipe:
    start: "30%, 40%"
    end: "30%, 37%"
    duration: 800
- assertVisible:
    id: "original_7_${output.p}"
- takeScreenshot: J-RDR-03-step9-partway-before
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_7_${output.p}"
    timeout: 20000
- assertNotVisible:
    id: "original_7_${output.prev}"
- takeScreenshot: J-RDR-03-step9-partway-reopened

# 10. Scroll to a NEW place without leaving the reader — chapter 12, on past its first paragraph —
#     then kill the app; relaunch; open the book -> that new place after a full restart (POS-013).
#     Nothing but the scroll itself has saved this position: the reader is not left with Back
#     (steps 7–9 do that), and `stopApp` is a force-stop, which gives the app no chance to save on
#     the way out. The page is bookmarked before the kill only to name it: the label says which
#     paragraph the app counts as the top one ("Chapter 12 · ¶ N"), and after the restart
#     "Remove bookmark here" says the reopened page is that same paragraph.
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:chaptersButton"
      OPENS: "Chapters"
- tapOn:
    id: "reader:chapterRow:11"
- extendedWaitUntil:
    notVisible: "Chapters"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*\\(ch12\\.1\\).*"
    timeout: 15000
- repeat:
    times: 40
    while:
      visible:
        id: "original_11_0"
    commands:
      - swipe:
          start: "30%, 40%"
          end: "30%, 30%"
          duration: 800
- swipe:
    start: "30%, 40%"
    end: "30%, 30%"
    duration: 800
- assertNotVisible:
    id: "original_11_0"
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: "Bookmark this page"
- tapOn: "Bookmark this page"
- extendedWaitUntil:
    visible: "Chapter 12 · ¶ \\d+"
    timeout: 5000
- copyTextFrom: "Chapter 12 · ¶ \\d+"
- evalScript: ${output.killLabel = maestro.copiedText}
# Past the chapter's first paragraph: a place no chapter jump and no Back has saved.
- assertTrue: ${parseInt(output.killLabel.split('¶ ')[1]) >= 2}
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Remove bookmark here"
    timeout: 5000
- takeScreenshot: J-RDR-03-step10-before-kill
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Open book"
    timeout: 45000
#     The Library already knows the new place: the Continue reading card is in chapter 12, not 8.
- scrollUntilVisible:
    element: "CH 12 OF 22"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_11_.*"
    timeout: 20000
- assertNotVisible:
    id: "original_11_0"
- assertNotVisible:
    id: "original_7_.*"
- assertNotVisible: ".*downstream\\. \\(1\\).*"
- takeScreenshot: J-RDR-03-step10-after-restart
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: "Remove bookmark here"
- assertVisible: "${output.killLabel}"
- tapOn: "Close"
