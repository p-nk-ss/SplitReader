appId: ${APP_ID}
name: J-LIB-19 Removing a book and adding it again
tags: [smoke, full, library, J-LIB-19]
# books: en-novel.epub, no-description.epub, plain-prose.epub, cover-b.epub
---
# J-LIB-19 — Removing a book and adding it again: the place and bookmarks are kept unless the
# reader asks to delete them; a removed book frees its free-tier slot.
# Fixtures: en-novel.epub (F-LONG, "The River Crossing": 22 chapters, every sentence carries a
# marker — "(1)", "(2)" … in chapter 1, "(ch3.1)", "(ch3.2)" … in chapter 3 — so "where the reader
# is" can be asserted from any paragraph on screen), no-description.epub (F-NODESC),
# plain-prose.epub (F-PROSE), cover-b.epub (F-COVER-B).
# Source of steps/checkpoints: docs/e2e/e2e_journeys.md J-LIB-19.
- runFlow: ../../subflows/launch_clean.yaml

# 1. Open book -> en-novel.epub; Chapter Picker -> "Chapter 3 — The Long Crossing" -> the reader
#    lands on that chapter's masthead: its title and its first paragraph are on screen (NAV-018)
#
# Same book from another picker root (versionCode 29). The picker's "Recent" and "Downloads"
# roots hand out DIFFERENT uris for one file (README "One file, two uris"). Up to v28 the app
# keyed a book by its uri alone, so a re-add from the other root was a new book at chapter 1
# (run 20261115T174915Z) and this journey had to pick en-novel.epub from Downloads every time.
# Since v29 the app recognises the file itself. So the picks of en-novel.epub are made from
# BOTH roots on purpose: step 1 from Recent (pick_file_in_recent.yaml), the re-adds of steps 6,
# 8 and 10 from Downloads (pick_file_in_downloads.yaml), and step 8b from Recent again while the
# book is in the library. Steps 8 and 8b fail on a v28 build (seen: Task 9d). The lines after
# the pick are import_book.yaml's own.
- runFlow:
    file: ../../subflows/pick_file_in_recent.yaml
    env:
      FILE: "en-novel.epub"
- runFlow: ../../subflows/dismiss_portrait_hint.yaml
- runFlow: ../../subflows/dismiss_portrait_hint.yaml
- scrollUntilVisible:
    element: ".*The old mill still stood at the bend of the river.*"
    direction: DOWN
    timeout: 120000
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../../subflows/show_bars.yaml
      - extendedWaitUntil:
          visible: ".*The River Crossing.*"
          timeout: 3000
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:chaptersButton"
      OPENS: "Chapters"
- tapOn: ".*The Long Crossing"
- extendedWaitUntil:
    notVisible: "Chapters"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*\\(ch3\\.1\\).*"
    timeout: 15000
- assertVisible: ".*The Long Crossing"

# 2. Scroll about a screen into chapter 3, Bookmarks -> "Bookmark this page" -> the bookmark is
#    listed under chapter 3. Back to Library.
- scroll
- assertVisible: ".*\\(ch3\\.\\d+\\).*"
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: "Bookmark this page"
- tapOn: "Bookmark this page"
- extendedWaitUntil:
    visible: "Remove bookmark here"
    timeout: 5000
- assertVisible: ".*The Long Crossing · ¶ \\d+"
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Remove bookmark here"
    timeout: 5000
- runFlow: ../../subflows/leave_reader.yaml

# 3. Add two more books -> "3 VOLUMES" (the free tier is full)
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "no-description.epub"
      TITLE: "No Description Here"
      FIRST_TEXT: "The old mill still stood at the bend of the river"
- runFlow: ../../subflows/leave_reader.yaml
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "plain-prose.epub"
      TITLE: "Plain Prose"
      FIRST_TEXT: "The old mill still stood at the bend of the river"
- runFlow: ../../subflows/leave_reader.yaml
# scrollUntilVisible, not assertVisible: on a phone the shelf header can sit below the fold under
# the Continue Reading hero (same reasoning as every "VOLUMES" check in J-LIB-01).
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000

# 4. Delete icon on "The River Crossing" -> the dialog says the place, bookmarks and notes are
#    kept, and its "Also delete…" checkbox is NOT ticked (LIB-027); ticking it changes the text to
#    "…will be deleted with it."; un-tick it again.
#
# The checkbox is addressed by its label, not by its testTag (delete_book_also_data_checkbox):
# the dialog is a Material AlertDialog — its own window, outside MainActivity's
# testTagsAsResourceId root — so the tag is not exposed as a resource-id (confirmed with
# `maestro hierarchy`, Tab_35_PixelTablet: the row has no resource-id). The ticked state sits on
# the clickable row (a View with checked=true), the label is its child TextView, hence
# `checked` + `containsChild`. "Not ticked" is `assertNotVisible … checked: true`: the un-ticked
# row carries no checked=false attribute Maestro could match (confirmed on-device — `checked:
# false` never matched it).
- scrollUntilVisible:
    element:
      text: "Delete book"
      childOf:
        id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Delete book"
    childOf:
      id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible: ".*will be removed from your library\\. Your place, bookmarks and notes are kept in case you add it again\\."
    timeout: 5000
- assertVisible: "Also delete my reading progress, bookmarks and notes"
- assertNotVisible:
    checked: true
    containsChild:
      text: "Also delete my reading progress, bookmarks and notes"
- tapOn: "Also delete my reading progress, bookmarks and notes"
- extendedWaitUntil:
    visible: ".*will be removed from your library\\. Your place, bookmarks and notes will be deleted with it\\."
    timeout: 5000
- assertVisible:
    checked: true
    containsChild:
      text: "Also delete my reading progress, bookmarks and notes"
- tapOn: "Also delete my reading progress, bookmarks and notes"
- extendedWaitUntil:
    visible: ".*Your place, bookmarks and notes are kept in case you add it again\\."
    timeout: 5000
- assertVisible: "Also delete my reading progress, bookmarks and notes"
- assertNotVisible:
    checked: true
    containsChild:
      text: "Also delete my reading progress, bookmarks and notes"

# 5. Delete (checkbox un-ticked) -> the card is gone, "2 VOLUMES". Open book -> cover-b.epub ->
#    imports without the limit dialog: a removed book whose data is kept holds no slot (LIB-024)
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible:
      id: "book_card_The River Crossing"
    timeout: 10000
- scrollUntilVisible:
    element: "· 2 VOLUMES"
    direction: DOWN
    timeout: 10000
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "cover-b.epub"
      TITLE: "The Blue Cover Book"
      FIRST_TEXT: "The old mill still stood at the bend of the river"
- assertNotVisible: "Library is full"
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000

# 6. Open book -> en-novel.epub (the removed book) with the library full again -> the limit
#    dialog; after Got it still 3 volumes, no card for it (LIB-025)
- runFlow:
    file: ../../subflows/pick_file_in_downloads.yaml
    env:
      FILE: "en-novel.epub"
- extendedWaitUntil:
    visible: "Library is full"
    timeout: 10000
- tapOn: "Got it"
- assertNotVisible: "Library is full"
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000
- assertNotVisible:
    id: "book_card_The River Crossing"

# 7. Delete "The Blue Cover Book" to make room -> "2 VOLUMES"
- scrollUntilVisible:
    element:
      text: "Delete book"
      childOf:
        id: "book_card_The Blue Cover Book"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Delete book"
    childOf:
      id: "book_card_The Blue Cover Book"
- extendedWaitUntil:
    visible: ".*will be removed from your library\\..*"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible:
      id: "book_card_The Blue Cover Book"
    timeout: 10000
- scrollUntilVisible:
    element: "· 2 VOLUMES"
    direction: DOWN
    timeout: 10000

# 8. Open book -> en-novel.epub, this time from Downloads (it was added from Recent) -> it opens
#    in chapter 3 where it was left, not at the start, and Bookmarks still lists the chapter 3
#    bookmark (LIB-023, LIB-028 — same book from another root). Back -> "3 VOLUMES".
- runFlow:
    file: ../../subflows/pick_file_in_downloads.yaml
    env:
      FILE: "en-novel.epub"
- extendedWaitUntil:
    notVisible: "Open book"
    timeout: 15000
- runFlow: ../../subflows/dismiss_portrait_hint.yaml
- extendedWaitUntil:
    visible: ".*\\(ch3\\.\\d+\\).*"
    timeout: 20000
- assertNotVisible: "Library is full"
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: ".*The Long Crossing · ¶ \\d+"
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: ".*The Long Crossing · ¶ \\d+"
    timeout: 5000
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000

# 8b. With the book in the library (3 VOLUMES, the free tier full), Open book -> en-novel.epub
#     from Recent (it is in the library under its Downloads uri) -> no limit dialog, it opens in
#     chapter 3 at its place; back in the Library still "3 VOLUMES" and ONE card "The River
#     Crossing" (LIB-029). On v28 this was a new book: the limit dialog.
- runFlow:
    file: ../../subflows/pick_file_in_recent.yaml
    env:
      FILE: "en-novel.epub"
- extendedWaitUntil:
    notVisible: "Open book"
    timeout: 15000
- assertNotVisible: "Library is full"
- runFlow: ../../subflows/dismiss_portrait_hint.yaml
- extendedWaitUntil:
    visible: ".*\\(ch3\\.\\d+\\).*"
    timeout: 20000
- assertNotVisible: "Library is full"
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000
- assertNotVisible: "Library is full"
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
# The proof of "one card" is "· 3 VOLUMES" above with no limit dialog; the index check below
# only sees cards that are composed (lazy shelf) and is a cheap extra.
- assertVisible:
    id: "book_card_The River Crossing"
    index: 0
- assertNotVisible:
    id: "book_card_The River Crossing"
    index: 1

# 9. Delete "The River Crossing" again, this time ticking "Also delete my reading progress,
#    bookmarks and notes" -> "2 VOLUMES"
- scrollUntilVisible:
    element:
      text: "Delete book"
      childOf:
        id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Delete book"
    childOf:
      id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible: ".*Your place, bookmarks and notes are kept in case you add it again\\."
    timeout: 5000
- assertNotVisible:
    checked: true
    containsChild:
      text: "Also delete my reading progress, bookmarks and notes"
- tapOn: "Also delete my reading progress, bookmarks and notes"
- extendedWaitUntil:
    visible: ".*Your place, bookmarks and notes will be deleted with it\\."
    timeout: 5000
- assertVisible:
    checked: true
    containsChild:
      text: "Also delete my reading progress, bookmarks and notes"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible:
      id: "book_card_The River Crossing"
    timeout: 10000
- scrollUntilVisible:
    element: "· 2 VOLUMES"
    direction: DOWN
    timeout: 10000

# 10. Open book -> en-novel.epub -> it opens at the start of chapter 1 and Bookmarks is empty
#     (LIB-026)
- runFlow:
    file: ../../subflows/pick_file_in_downloads.yaml
    env:
      FILE: "en-novel.epub"
- extendedWaitUntil:
    notVisible: "Open book"
    timeout: 15000
- runFlow: ../../subflows/dismiss_portrait_hint.yaml
- extendedWaitUntil:
    visible: ".*downstream\\. \\(1\\).*"
    timeout: 20000
- assertNotVisible: ".*\\(ch3\\.\\d+\\).*"
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:bookmarksButton"
      OPENS: "No bookmarks yet.*"
- assertNotVisible: ".*The Long Crossing · ¶ \\d+"
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "No bookmarks yet.*"
    timeout: 5000
- runFlow: ../../subflows/leave_reader.yaml
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000
