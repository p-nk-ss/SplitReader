appId: ${APP_ID}
name: J-LIB-02 Catalog evening
tags: [smoke, full, library, network, J-LIB-02]
# No `# books:` header on purpose: this journey is entirely live catalog/network, no local
# fixtures — run.sh pushes nothing for it.
---
# J-LIB-02 — Catalog evening: search, download from Gutenberg and Standard Ebooks, hit the cap,
# go offline. Source: docs/e2e/e2e_journeys.md J-LIB-02. No fixtures; live catalog, real network.
#
# Corrected from the source journey (verified against CatalogScreen.kt/CatalogViewModel.kt):
#  - There is no single combined "Gutenberg and/or Standard Ebooks" search. Two source pills pick
#    ONE feed at a time: "Open Library" (default; the Gutenberg OPDS feed under a different
#    display label — see CatalogSource.kt) and "Standard Ebooks".
#  - The per-row action is one button labelled "Read" (DownloadButton, CatalogScreen.kt), not
#    "Download" followed by a separate "Open" — one tap downloads, parses, adds to the library
#    AND navigates straight into the reader (CatalogViewModel.downloadAndOpen). There is no
#    second button. Each result row has no distinguishing id, so the (consistently topmost,
#    most-relevant) result's button is addressed by `index: 0`.
#  - A nonsense query that succeeds with zero results shows "No books found" with NO Retry
#    action (CenteredMessage(actionLabel = null) at CatalogScreen.kt:225) — Retry only appears on
#    an actual errorMessage (e.g. offline), per CatalogScreen.kt:214-219.
#  - CatalogViewModel.init runs an empty-query search on open ("Populate with popular books so
#    the screen is useful before the user types anything"), so the CAT-002 "Search by title or
#    author to begin" placeholder never actually shows in steady state — the catalog opens
#    straight on a "POPULAR" list. Step 1 below asserts that instead.
#  - FIXED in v26 (commit d39b6ec, "the search field is labelled by its placeholder, not a
#    description"): the search field's own placeholder text ("Search by title or author…") is
#    now real text inside the field's decoration box, so it reaches the accessibility tree and a
#    plain `tapOn` for it works directly — but only while the field is empty; a later search in
#    the same session (query state persists across navigation) has to fall back to the old
#    position-based selector instead, since the placeholder is gone once there's leftover text.
#    Every tap of the search field below still goes through `../../subflows/tap_catalog_search.yaml`,
#    which now tries the placeholder first and falls back automatically — see that file's header
#    for the full fix and the on-device evidence for both cases.
#
# CAT-008 FIXED in v26 (commit d0df6c2, "re-reading an owned book never hits the free-tier
# limit"): CatalogViewModel.downloadAndOpen now asks CatalogRepository.localUriFor(book) — a
# pure, no-network computation of the deterministic uri EpubDownloader will use — BEFORE gating
# canAddNew, so an already-owned book's uri matches and it opens straight away even at the
# free-tier cap. Step 9 below now asserts the correct (fixed) behaviour: re-reading an
# already-owned title opens it, with no limit dialog. The genuinely-new-4th-book case (step 8,
# "Moby Dick" — a title this library does not own) is unaffected by this fix and still correctly
# shows the limit dialog, since its uri can never match an owned book's.
- runFlow: ../../subflows/launch_clean.yaml

# 1. Catalog -> opens on a "POPULAR" list (CAT-002 — see the correction note above: the
#    placeholder text is unreachable in steady state)
- tapOn: "Catalog"
- assertVisible: "POPULAR"

# 2. Tap the search field -> keyboard sits directly under the list, no blank band above (CAT-009)
#    (Maestro can't measure a "blank band"; this only proves the field is reachable and takes
#    focus without the screen crashing/jumping — see report for the visual-only caveat.)
- runFlow: ../../subflows/tap_catalog_search.yaml

# 3. Type "Pride and Prejudice", submit -> results listed with cover/title/author + a Read
#    action (CAT-001)
- inputText: "Pride and Prejudice"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Pride and Prejudice"
    timeout: 60000

# 4. Tap Read on the top result -> downloads, parses and opens in the reader (CAT-004)
# Checked by the reader's languageChip (same pattern as steps 6/7/9 below), not literal chapter-1
# text: this catalog download is the George Allen illustrated Gutenberg edition of Pride and
# Prejudice (same genre as J-LIB-01's alice-illustrated.epub - genuine front matter: preface, list
# of illustrations, title page, publisher's device, two illustrations - not pg-license boilerplate;
# PRS-018's actual boilerplate-stripping behaviour is exercised by every other journey's
# non-illustrated Gutenberg/fixture imports). Confirmed on-device (Tab_35_PixelTablet, 2026-11-09,
# three separate attempts) that this edition's drop-cap paragraph openings make literal-text
# `scrollUntilVisible` unreliable here even at a 90s timeout - not just the literal opening
# sentence ("It is a truth universally acknowledged...", drop-cap "I"), but also its second
# sentence ("However little known...") was scrolled past without ever registering as visible, and
# a direct on-device probe found "Mr. Bennet was among the earliest..." (chapter 1's third
# paragraph, several screens in) ALSO rendered with its leading "M" split off as "R. BENNET" -
# this edition's side-by-side bilingual layout appears to let at least some paragraph-opening
# drop caps step past scrollUntilVisible's visibility check entirely between scroll increments.
#
# languageChip timeout 60000 -> 90000 -> 150000 (every catalog-download wait in this flow, same
# bump): confirmed on-device (Tab_35_PixelTablet, 2026-11-10) this exact step timed out three
# times running (60s, then 90s) under sustained heavy host load (`top`, repeated samples across
# this session: load average 6-14, climbing over time, not a one-off spike) with every other step
# in the same runs also 3-10x slower than a previous clean run of this flow (e.g. a tapOnElement
# that took 2.2s elsewhere took 12-24s here) - a host-resource symptom, not a download- or
# app-specific one, so the fix is headroom here rather than anywhere else. 150s is generous
# relative to this flow's historical clean-host runtime (the whole flow passed in well under 5
# minutes pre-v26) but costs nothing when the step finishes early, same reasoning as other
# generous timeouts already in this suite (e.g. pick_file.yaml's 35s).
#
# Every search-RESULTS wait in this flow (e.g. `visible: "Walden"`/"Frankenstein"/"Moby Dick"
# right after a search) is also bumped 30000 -> 60000, same session, same host-load evidence:
# confirmed on-device that even a search-results wait (no download/parse involved, just the
# catalog API round-trip + list render) timed out at 30s under this load.
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 150000

# 5. Chapter 2, add a bookmark, Back -> Pride and Prejudice is in the Library (CAT-004)
# Retried up to 3x (open_bars.yaml -> tap chaptersButton -> poll), not a single open_bars.yaml +
# tap: confirmed on-device (Tab_35_PixelTablet, 2026-11-09) that on this specific illustrated
# edition's opening page (cover/title page/illustrations/a full critical-essay preface - far more
# front matter than a typical import), even a tap that successfully revealed the chip can lose
# the race against READER_BARS_AUTO_HIDE_MS (3500ms) before the next command (here,
# chaptersButton) actually executes - a direct on-device probe also found plain content taps on
# this particular page inconsistent at toggling the bars at all (open_bars.yaml's own fallback
# taps already cover that per-attempt). Each attempt's "Chapters" check is a short, optional poll
# except the last, which is the real (non-optional) assertion with a generous timeout.
#
# 4th attempt + final timeout 15000 -> 30000 added 2026-11-10: confirmed on-device
# (Tab_35_PixelTablet, under the same sustained heavy host load documented at this flow's step 4)
# that even 3 attempts could exhaust themselves (a single open_bars.yaml call alone took 56s,
# more than its own nominal ~20s budget) before "Chapters" ever appeared - headroom here, not a
# new app/logic issue, same reasoning as the step-4 languageChip timeout bump above.
- runFlow: ../../subflows/open_bars.yaml
- tapOn:
    id: "reader:chaptersButton"
- extendedWaitUntil:
    visible: "Chapters"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible: "Chapters"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:chaptersButton"
      - extendedWaitUntil:
          visible: "Chapters"
          timeout: 3000
          optional: true
- runFlow:
    when:
      notVisible: "Chapters"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:chaptersButton"
      - extendedWaitUntil:
          visible: "Chapters"
          timeout: 3000
          optional: true
- runFlow:
    when:
      notVisible: "Chapters"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:chaptersButton"
- extendedWaitUntil:
    visible: "Chapters"
    timeout: 60000
# "CHAPTER XLIV.", not "Chapter 2" (the journey's literal guess, which never appears anywhere in
# this dialog): confirmed on-device (Tab_35_PixelTablet, 2026-11-09) that this illustrated
# edition's Chapters list labels each row with the book's OWN printed chapter heading (as it
# appears embedded in that chapter's text) next to a separate, unrelated sequential roman-numeral
# index (I, II, III... - which counts every parser-level break, including front-matter pages, so
# it does not line up with the novel's own chapter numbers at all). The test's actual intent
# (LIB-005: a bookmark survives navigating to a different chapter) does not require chapter 2
# specifically, so this targets a row confirmed to land reliably at this scroll distance - the
# early, front-matter-heavy rows (including the real "chapter 2") proved unreliable scroll
# targets (confirmed on-device, 3 separate attempts: a short row a few items below the top was
# scrolled past without registering visible, at both default and reduced scroll speed) while
# "CHAPTER XLIV." consistently lands in view after one DOWN scroll from the top, same position
# every time.
- scrollUntilVisible:
    element: "CHAPTER XLIV."
    direction: DOWN
    timeout: 15000
- tapOn: "CHAPTER XLIV."
# "Bookmark this page", not "Bookmarks", for the open-check below: confirmed in source
# (ReaderChrome.kt:134) that the bookmarksButton ICON ITSELF carries contentDescription =
# "Bookmarks" - the exact same text the BookmarksDialog's own title also uses
# (ReaderDialogs.kt:597) - so waiting on "Bookmarks" is satisfied the instant the bars (and their
# bookmarksButton) are visible, whether or not the tap actually opened the dialog. Confirmed
# on-device (Tab_35_PixelTablet, 2026-11-10, under heavy host load) that this let the flow sail
# past a bookmarksButton tap that landed too late (bars had auto-hidden again) straight into a
# "Bookmark this page" tap with no dialog ever open, failing with "Element not found". Retried up
# to 3x (open_bars.yaml -> tap bookmarksButton -> poll for "Bookmark this page", the dialog's own
# action text, present only once it's actually open), same pattern as the "Chapters" sequence
# above - chaptersButton has no such ambiguity (no contentDescription on that icon; only "Chapters"
# the dialog's own title matches it), so it is unchanged.
- runFlow: ../../subflows/open_bars.yaml
- tapOn:
    id: "reader:bookmarksButton"
- extendedWaitUntil:
    visible: "Bookmark this page"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible: "Bookmark this page"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:bookmarksButton"
      - extendedWaitUntil:
          visible: "Bookmark this page"
          timeout: 3000
          optional: true
- runFlow:
    when:
      notVisible: "Bookmark this page"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:bookmarksButton"
- extendedWaitUntil:
    visible: "Bookmark this page"
    timeout: 20000
- tapOn: "Bookmark this page"
- tapOn: "Close"
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "Pride and Prejudice"

# 6. Catalog -> switch to the Standard Ebooks pill -> search "Walden", Read -> downloads, opens,
#    in the Library (CAT-005)
# index: 1, not 0: confirmed on-device (Tab_35_PixelTablet, 2026-11-09, reproduced 3x) that a
# Standard Ebooks search for "Walden" ranks "Poetry" by Ring Lardner ABOVE "Walden" by Henry
# David Thoreau itself - this journey just displays whatever order the Standard Ebooks search API
# returns, so index 0 is not reliably "the book you searched for" the way it is for the Open
# Library/Gutenberg searches elsewhere in this flow. A selector scoped to the row (`rightOf`/
# `below` the "Walden"/"Henry David Thoreau" text, `containsDescendants`) was tried first and
# rejected: `rightOf`/`below` ignore the OTHER axis entirely when picking among several
# candidates (confirmed via `maestro --debug-output`: `rightOf: "Henry David Thoreau"` still
# resolved to Poetry's Read button, the first "Read" in document order, not the nearest one) and
# `containsDescendants` returned "Element not found" for a row confirmed (by hierarchy dump) to
# contain exactly that descendant text. Index 1 is simply "the second (and last) result for this
# exact query", confirmed stable across 3 consecutive searches.
- tapOn: "Catalog"
- tapOn: "Standard Ebooks"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Walden"
- pressKey: Enter
# NOT `hideKeyboard` (tried and reverted, 2026-11-10): confirmed by decompiling Maestro's own
# AndroidDriver.hideKeyboard - it is literally `adb shell input keyevent 4` (KEYCODE_BACK), relying
# on Android's own "back dismisses an open IME first" behaviour. That only helps when the keyboard
# is STILL showing; confirmed on-device that it is not always still showing at this point (Enter's
# own imeAction=Search can already have dropped focus) - when it isn't, the same keyevent instead
# navigates the APP back a screen (Catalog -> Home), losing the search entirely (observed on-device:
# the next "Walden" wait then failed with the Home screen in the failure screenshot, not Catalog).
# Fixed instead with `scrollUntilVisible` on the actual target (`Read`, index 1) below, which
# handles the keyboard-occlusion case (confirmed on-device, 2026-11-10, under heavy host load: the
# keyboard can still be showing at this point even after Enter/imeAction=Search, covering roughly
# the bottom half of the screen and composing the SECOND result row out of the viewport) without
# any navigation risk - a no-op scroll once the keyboard is already down and the row is visible.
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Walden"
    timeout: 60000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- scrollUntilVisible:
    element:
      text: "Read"
      index: 1
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Read"
    index: 1
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 150000
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "Walden"

# 7. Catalog -> switch back to Open Library -> search "Frankenstein", Read -> Library shows
#    "3 VOLUMES"
- tapOn: "Catalog"
- tapOn: "Open Library"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Frankenstein"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Frankenstein"
    timeout: 60000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 150000
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "· 3 VOLUMES"

# 8. Catalog -> search "Moby Dick", tap Read -> library-limit dialog with Upgrade/Got it; after
#    Got it the book is not in the Library (CAT-007)
# "Moby Dick; Or, The Whale", not the bare substring "Moby": confirmed on-device (Tab_35
# PixelTablet, 2026-11-09) that this search returns several near-duplicate editions/mirrors of
# the same title (5+ rows all containing "Moby Dick"), and a bare-substring `visible: "Moby"`
# wait timed out at the full 30s even with a screenshot at that exact moment showing several
# matching rows plainly on screen - a multi-match ambiguity in how extendedWaitUntil evaluates a
# regex matching several nodes at once, not a real absence. The full, more specific title is
# still a substring match against more than one row (every Gutenberg mirror uses the same title)
# but exercises the same code path with far fewer candidates.
- tapOn: "Catalog"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Moby Dick"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Moby Dick; Or, The Whale"
    timeout: 60000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible: "Library is full"
    timeout: 15000
- tapOn: "Got it"
- tapOn: "Library"
- assertNotVisible: "Moby Dick"
- assertVisible: "· 3 VOLUMES"

# 9. Catalog -> search "Pride and Prejudice" again, Read the same (already-owned) title.
# CAT-008 FIXED in v26 (see the header note above, commit d0df6c2): re-reading an already-owned
# book at the free-tier cap should now open it directly, with NO limit dialog, against this exact
# repro (the one that deterministically showed "Library is full" pre-fix). Checked via the
# reader's languageChip (same pattern as step 4's open-check, for the same reason: this
# illustrated edition's drop-cap chapter openings make a literal-text wait unreliable), then back
# to the Library, still "3 VOLUMES" (no phantom 4th volume from a redundant download/add -
# EpubDownloader.download is idempotent).
- tapOn: "Catalog"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Pride and Prejudice"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Pride and Prejudice"
    timeout: 60000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
# No `extendedWaitUntil: notVisible: "Library is full"` beforehand - an immediate check can pass
# trivially before the app has had any time to show the dialog. The real proof the fix works is
# that the reader's languageChip appears at all: pre-fix, the dialog interrupted here and the
# flow never left Catalog, so this wait would time out instead.
#
# Soft wait + reveal-tap fallback, not one flat 150000ms wait: confirmed on-device
# (Tab_35_PixelTablet, 2026-11-10) that RE-opening an already-read book (unlike steps 4/6/7's
# fresh downloads) can resume at its last saved position (chapter XLIV, from step 5's bookmark)
# with a position-restoring scroll/jump that, under heavy host load, can still be settling past
# READER_BARS_AUTO_HIDE_MS (3500ms) - so the bars that were visible right after open can hide
# again before this wait ever samples them, even though the book opened correctly (no stuck
# loading spinner, no dialog). The fallback reveal tap recovers that case without weakening the
# real proof-of-fix (languageChip still has to actually appear for either wait to pass).
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "reader:languageChip"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 90000
- assertNotVisible: "Library is full"
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "· 3 VOLUMES"

# 10. In the reader, Bookmarks -> the chapter-2 bookmark from step 5 is still listed (LIB-005)
# Same "Bookmarks" ambiguity as step 5 (see that step's comment): the bookmarksButton icon's own
# contentDescription is "Bookmarks", so waiting on that text doesn't prove the dialog opened.
# "(Bookmark this page|Remove bookmark here)" is dialog-exclusive and always exactly one of the
# two is showing (the toggle row's own label, mutually exclusive on isCurrentBookmarked) -
# confirmed on-device (Tab_35_PixelTablet, 2026-11-10) this exact ambiguity caused a real failure
# here too (reopening resumes at the bookmarked chapter, so "Remove bookmark here" is expected).
- tapOn: "Pride and Prejudice"
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 15000
- runFlow: ../../subflows/open_bars.yaml
- runFlow: ../../subflows/open_bars.yaml
- tapOn:
    id: "reader:bookmarksButton"
- extendedWaitUntil:
    visible: "(Bookmark this page|Remove bookmark here)"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible: "(Bookmark this page|Remove bookmark here)"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:bookmarksButton"
      - extendedWaitUntil:
          visible: "(Bookmark this page|Remove bookmark here)"
          timeout: 3000
          optional: true
- runFlow:
    when:
      notVisible: "(Bookmark this page|Remove bookmark here)"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:bookmarksButton"
- extendedWaitUntil:
    visible: "(Bookmark this page|Remove bookmark here)"
    timeout: 20000
- assertNotVisible: "No bookmarks yet"
- tapOn: "Close"
- runFlow: ../../subflows/back_to_library.yaml

# 11. Catalog -> search "zxqvbnm qwertyuiop" -> an empty-results state, no crash, no Retry (no
#     match found, not an error) (CAT-003)
- tapOn: "Catalog"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "zxqvbnm qwertyuiop"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "No books found"
    timeout: 60000

# 12. Turn network off, search "Dracula" -> error state with Retry (CAT-003)
# NETWORK-FLAKY: airplane mode on the emulator is occasionally slow to take effect, and the error
# message text itself is NOT fixed (CatalogViewModel.kt surfaces the raw exception message), so
# this asserts the Retry action rather than specific wording.
- setAirplaneMode: enabled
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Dracula"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Retry"
    timeout: 60000

# 13. Turn network on, tap Retry -> results load (CAT-003)
# The flow restores network itself before finishing, whatever the outcome of this step (global
# constraint: an airplane-mode step must never leave the emulator offline).
- setAirplaneMode: disabled
- tapOn: "Retry"
- extendedWaitUntil:
    visible: "Dracula"
    timeout: 60000
