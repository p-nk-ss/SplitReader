appId: ${APP_ID}
name: J-LIB-02 Catalog evening
tags: [smoke, full, library, network, J-LIB-02]
# No `# books:` header on purpose: this journey is entirely live catalog/network, no local
# fixtures — run.sh pushes nothing for it.
---
# J-LIB-02 — Catalog evening: search, download from Gutenberg and Standard Ebooks, hit the cap,
# go offline. Source: docs/e2e/e2e_journeys.md J-LIB-02. No fixtures; live catalog, real network.
#
# Corrected from the source journey (verified against CatalogScreen.kt/CatalogViewModel.kt):
#  - There is no single combined "Gutenberg and/or Standard Ebooks" search. Two source pills pick
#    ONE feed at a time: "Open Library" (default; the Gutenberg OPDS feed under a different
#    display label — see CatalogSource.kt) and "Standard Ebooks".
#  - The per-row action is one button labelled "Read" (DownloadButton, CatalogScreen.kt), not
#    "Download" followed by a separate "Open" — one tap downloads, parses, adds to the library
#    AND navigates straight into the reader (CatalogViewModel.downloadAndOpen). There is no
#    second button. Each result row has no distinguishing id, so the (consistently topmost,
#    most-relevant) result's button is addressed by `index: 0`.
#  - A nonsense query that succeeds with zero results shows "No books found" with NO Retry
#    action (CenteredMessage(actionLabel = null) at CatalogScreen.kt:225) — Retry only appears on
#    an actual errorMessage (e.g. offline), per CatalogScreen.kt:214-219.
#  - CatalogViewModel.init runs an empty-query search on open ("Populate with popular books so
#    the screen is useful before the user types anything"), so the CAT-002 "Search by title or
#    author to begin" placeholder never actually shows in steady state — the catalog opens
#    straight on a "POPULAR" list. Step 1 below asserts that instead.
#  - REAL APP FINDING (confirmed on-device, not fixed): the search field's own placeholder text
#    ("Search by title or author…") never reaches the accessibility tree (confirmed via `maestro
#    hierarchy`: no node anywhere on this screen carries that text, and the EditText's own
#    hintText is empty too) — a plain `tapOn` for it always fails. Every tap of the search field
#    below goes through `../../subflows/tap_catalog_search.yaml`, which works around this with a
#    position-based selector; see that file's header for the full evidence.
#
# CONFIRMED APP BUG (not fixed — see task-7a-report.md Take 4 and step 9 below):
# CatalogViewModel.downloadAndOpen gates on `addBookToLibraryUseCase.canAddNew(null)` — uri is
# unknown before the download runs, so at the free-tier cap this always shows the limit dialog,
# even for a book already owned (CAT-008), because the uri-based "already mine" exemption in
# canAddNew only helps once uri is non-null. Confirmed on-device, reproduced deterministically.
# Step 9 below asserts the dialog actually appears (the real, broken behaviour), not the
# originally-intended clean re-open, so this stays visible on every run.
- runFlow: ../../subflows/launch_clean.yaml

# 1. Catalog -> opens on a "POPULAR" list (CAT-002 — see the correction note above: the
#    placeholder text is unreachable in steady state)
- tapOn: "Catalog"
- assertVisible: "POPULAR"

# 2. Tap the search field -> keyboard sits directly under the list, no blank band above (CAT-009)
#    (Maestro can't measure a "blank band"; this only proves the field is reachable and takes
#    focus without the screen crashing/jumping — see report for the visual-only caveat.)
- runFlow: ../../subflows/tap_catalog_search.yaml

# 3. Type "Pride and Prejudice", submit -> results listed with cover/title/author + a Read
#    action (CAT-001)
- inputText: "Pride and Prejudice"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Pride and Prejudice"
    timeout: 30000

# 4. Tap Read on the top result -> downloads, parses and opens in the reader (CAT-004)
# Checked by the reader's languageChip (same pattern as steps 6/7/9 below), not literal chapter-1
# text: this catalog download is the George Allen illustrated Gutenberg edition of Pride and
# Prejudice (same genre as J-LIB-01's alice-illustrated.epub - genuine front matter: preface, list
# of illustrations, title page, publisher's device, two illustrations - not pg-license boilerplate;
# PRS-018's actual boilerplate-stripping behaviour is exercised by every other journey's
# non-illustrated Gutenberg/fixture imports). Confirmed on-device (Tab_35_PixelTablet, 2026-11-09,
# three separate attempts) that this edition's drop-cap paragraph openings make literal-text
# `scrollUntilVisible` unreliable here even at a 90s timeout - not just the literal opening
# sentence ("It is a truth universally acknowledged...", drop-cap "I"), but also its second
# sentence ("However little known...") was scrolled past without ever registering as visible, and
# a direct on-device probe found "Mr. Bennet was among the earliest..." (chapter 1's third
# paragraph, several screens in) ALSO rendered with its leading "M" split off as "R. BENNET" -
# this edition's side-by-side bilingual layout appears to let at least some paragraph-opening
# drop caps step past scrollUntilVisible's visibility check entirely between scroll increments.
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 60000

# 5. Chapter 2, add a bookmark, Back -> Pride and Prejudice is in the Library (CAT-004)
# Retried up to 3x (open_bars.yaml -> tap chaptersButton -> poll), not a single open_bars.yaml +
# tap: confirmed on-device (Tab_35_PixelTablet, 2026-11-09) that on this specific illustrated
# edition's opening page (cover/title page/illustrations/a full critical-essay preface - far more
# front matter than a typical import), even a tap that successfully revealed the chip can lose
# the race against READER_BARS_AUTO_HIDE_MS (3500ms) before the next command (here,
# chaptersButton) actually executes - a direct on-device probe also found plain content taps on
# this particular page inconsistent at toggling the bars at all (open_bars.yaml's own fallback
# taps already cover that per-attempt). Each attempt's "Chapters" check is a short, optional poll
# except the last, which is the real (non-optional) assertion with a generous timeout.
- runFlow: ../../subflows/open_bars.yaml
- tapOn:
    id: "reader:chaptersButton"
- extendedWaitUntil:
    visible: "Chapters"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible: "Chapters"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:chaptersButton"
      - extendedWaitUntil:
          visible: "Chapters"
          timeout: 3000
          optional: true
- runFlow:
    when:
      notVisible: "Chapters"
    commands:
      - runFlow: ../../subflows/open_bars.yaml
      - tapOn:
          id: "reader:chaptersButton"
- extendedWaitUntil:
    visible: "Chapters"
    timeout: 15000
# "CHAPTER XLIV.", not "Chapter 2" (the journey's literal guess, which never appears anywhere in
# this dialog): confirmed on-device (Tab_35_PixelTablet, 2026-11-09) that this illustrated
# edition's Chapters list labels each row with the book's OWN printed chapter heading (as it
# appears embedded in that chapter's text) next to a separate, unrelated sequential roman-numeral
# index (I, II, III... - which counts every parser-level break, including front-matter pages, so
# it does not line up with the novel's own chapter numbers at all). The test's actual intent
# (LIB-005: a bookmark survives navigating to a different chapter) does not require chapter 2
# specifically, so this targets a row confirmed to land reliably at this scroll distance - the
# early, front-matter-heavy rows (including the real "chapter 2") proved unreliable scroll
# targets (confirmed on-device, 3 separate attempts: a short row a few items below the top was
# scrolled past without registering visible, at both default and reduced scroll speed) while
# "CHAPTER XLIV." consistently lands in view after one DOWN scroll from the top, same position
# every time.
- scrollUntilVisible:
    element: "CHAPTER XLIV."
    direction: DOWN
    timeout: 15000
- tapOn: "CHAPTER XLIV."
- runFlow: ../../subflows/open_bars.yaml
- tapOn:
    id: "reader:bookmarksButton"
- extendedWaitUntil:
    visible: "Bookmarks"
    timeout: 15000
- tapOn: "Bookmark this page"
- tapOn: "Close"
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "Pride and Prejudice"

# 6. Catalog -> switch to the Standard Ebooks pill -> search "Walden", Read -> downloads, opens,
#    in the Library (CAT-005)
# index: 1, not 0: confirmed on-device (Tab_35_PixelTablet, 2026-11-09, reproduced 3x) that a
# Standard Ebooks search for "Walden" ranks "Poetry" by Ring Lardner ABOVE "Walden" by Henry
# David Thoreau itself - this journey just displays whatever order the Standard Ebooks search API
# returns, so index 0 is not reliably "the book you searched for" the way it is for the Open
# Library/Gutenberg searches elsewhere in this flow. A selector scoped to the row (`rightOf`/
# `below` the "Walden"/"Henry David Thoreau" text, `containsDescendants`) was tried first and
# rejected: `rightOf`/`below` ignore the OTHER axis entirely when picking among several
# candidates (confirmed via `maestro --debug-output`: `rightOf: "Henry David Thoreau"` still
# resolved to Poetry's Read button, the first "Read" in document order, not the nearest one) and
# `containsDescendants` returned "Element not found" for a row confirmed (by hierarchy dump) to
# contain exactly that descendant text. Index 1 is simply "the second (and last) result for this
# exact query", confirmed stable across 3 consecutive searches.
- tapOn: "Catalog"
- tapOn: "Standard Ebooks"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Walden"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Walden"
    timeout: 30000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 1
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 60000
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "Walden"

# 7. Catalog -> switch back to Open Library -> search "Frankenstein", Read -> Library shows
#    "3 VOLUMES"
- tapOn: "Catalog"
- tapOn: "Open Library"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Frankenstein"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Frankenstein"
    timeout: 30000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 60000
- runFlow: ../../subflows/back_to_library_from_catalog.yaml
- assertVisible: "· 3 VOLUMES"

# 8. Catalog -> search "Moby Dick", tap Read -> library-limit dialog with Upgrade/Got it; after
#    Got it the book is not in the Library (CAT-007)
# "Moby Dick; Or, The Whale", not the bare substring "Moby": confirmed on-device (Tab_35
# PixelTablet, 2026-11-09) that this search returns several near-duplicate editions/mirrors of
# the same title (5+ rows all containing "Moby Dick"), and a bare-substring `visible: "Moby"`
# wait timed out at the full 30s even with a screenshot at that exact moment showing several
# matching rows plainly on screen - a multi-match ambiguity in how extendedWaitUntil evaluates a
# regex matching several nodes at once, not a real absence. The full, more specific title is
# still a substring match against more than one row (every Gutenberg mirror uses the same title)
# but exercises the same code path with far fewer candidates.
- tapOn: "Catalog"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Moby Dick"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Moby Dick; Or, The Whale"
    timeout: 30000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible: "Library is full"
    timeout: 15000
- tapOn: "Got it"
- tapOn: "Library"
- assertNotVisible: "Moby Dick"
- assertVisible: "· 3 VOLUMES"

# 9. Catalog -> search "Pride and Prejudice" again, Read the same (already-owned) title.
# CONFIRMED REAL APP BUG (CAT-008), not fixed per the rules: the possible-bug note above the
# preconditions predicted this from reading CatalogViewModel.downloadAndOpen - canAddNew(null) is
# gated BEFORE the uri is known (the download/parse hasn't run yet), so it can never recognize
# "this is a book I already own" via a uri match; at the free-tier cap it ALWAYS shows the
# library-limit dialog, even for re-reading an already-owned title. This is now confirmed
# on-device (Tab_35_PixelTablet, 2026-11-09, reproduced deterministically, not a one-off race -
# consistent with the code reading, since uri=null can never uri-match anything): the "Library is
# full" dialog appears here instead of the reader opening. LIB-002 says this must NOT happen for
# an owned book; this flow asserts the broken behaviour explicitly (not the originally-intended
# "opens cleanly") so the finding stays visible on every run rather than silently passing. The
# dialog is dismissed and the Library checked intact (no phantom 4th volume, no lost volume)
# before continuing - the bug blocks re-reading from the catalog, it does not corrupt data.
- tapOn: "Catalog"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Pride and Prejudice"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Pride and Prejudice"
    timeout: 30000
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- tapOn:
    text: "Read"
    index: 0
- extendedWaitUntil:
    visible: "Library is full"
    timeout: 15000
- tapOn: "Got it"
- tapOn: "Library"
- assertVisible: "· 3 VOLUMES"

# 10. In the reader, Bookmarks -> the chapter-2 bookmark from step 5 is still listed (LIB-005)
- tapOn: "Pride and Prejudice"
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 15000
- runFlow: ../../subflows/open_bars.yaml
- runFlow: ../../subflows/open_bars.yaml
- tapOn:
    id: "reader:bookmarksButton"
- extendedWaitUntil:
    visible: "Bookmarks"
    timeout: 15000
- assertNotVisible: "No bookmarks yet"
- tapOn: "Close"
- runFlow: ../../subflows/back_to_library.yaml

# 11. Catalog -> search "zxqvbnm qwertyuiop" -> an empty-results state, no crash, no Retry (no
#     match found, not an error) (CAT-003)
- tapOn: "Catalog"
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "zxqvbnm qwertyuiop"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "No books found"
    timeout: 30000

# 12. Turn network off, search "Dracula" -> error state with Retry (CAT-003)
# NETWORK-FLAKY: airplane mode on the emulator is occasionally slow to take effect, and the error
# message text itself is NOT fixed (CatalogViewModel.kt surfaces the raw exception message), so
# this asserts the Retry action rather than specific wording.
- setAirplaneMode: enabled
- runFlow: ../../subflows/tap_catalog_search.yaml
- inputText: "Dracula"
- pressKey: Enter
- runFlow: ../../subflows/dismiss_stylus_popup.yaml
- extendedWaitUntil:
    visible: "Retry"
    timeout: 30000

# 13. Turn network on, tap Retry -> results load (CAT-003)
# The flow restores network itself before finishing, whatever the outcome of this step (global
# constraint: an airplane-mode step must never leave the emulator offline).
- setAirplaneMode: disabled
- tapOn: "Retry"
- extendedWaitUntil:
    visible: "Dracula"
    timeout: 30000
