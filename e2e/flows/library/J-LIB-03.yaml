appId: ${APP_ID}
name: J-LIB-03 A folder of bad files
tags: [smoke, full, library, J-LIB-03]
# books: corrupt.epub, corrupt.fb2, corrupt.mobi, short-header.epub, huffcdic.mobi, kf8.azw3, drm.mobi, no-chapters.fb2, empty.epub, alice-illustrated.epub, full-features.fb2, zipbomb.epub, oversized.fb2
#
# (one line, by e2e/run.sh's `# books:` header convention — see e2e/README.md)
# zipbomb.epub/oversized.fb2 are built locally (`python3 e2e/books/build_fixtures.py --large`,
# see e2e/books/SOURCES.md), gitignored, NOT in version control — generate them once before
# running this flow. Steps 4/5 below now exercise both (v26 fix, commit 5472c85 — see the note
# there); they were MANUAL/unexercised before that fix (app process OOM-crashed instead of
# showing an error).
---
# J-LIB-03 — A folder of bad files: every one fails cleanly and none eats a free slot
# Fixtures: corrupt.epub/.fb2/.mobi, short-header.epub, huffcdic.mobi, kf8.azw3, drm.mobi,
# no-chapters.fb2, empty.epub, alice-illustrated.epub, full-features.fb2, zipbomb.epub,
# oversized.fb2 (the last two built locally with `python3 e2e/books/build_fixtures.py --large`,
# gitignored — see e2e/books/SOURCES.md).
# Source: docs/e2e/e2e_journeys.md J-LIB-03.
#
# Every bad import (corrupt.*/short-header/huffcdic/azw3/drm/no-chapters) fails at PARSE time,
# before the book is ever added — HomeErrorDialog ("Can't open this book") shows on Home, nothing
# navigates. empty.epub is the one exception: EpubParser does not reject a book with zero
# readable paragraphs, so it DOES parse, get added, and auto-open into the reader, which shows
# its own "Nothing to read here" notice (ReaderChrome.kt's EmptyBookNotice) instead of a
# HomeErrorDialog. The source journey's step 11 hedge ("if it is added, tap its card") is
# resolved by this: it IS added and auto-opens, same as any successful import (LIB-009) — fixed
# below instead of tapping a card that was never shown.
- runFlow: ../../subflows/launch_clean.yaml

# 1. corrupt.epub -> readable error, no stack trace, stays on Home (ERR-004)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "corrupt.epub" } }
- extendedWaitUntil:
    visible: "Can't open this book"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 2. corrupt.fb2 -> readable error, no crash (ERR-004)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "corrupt.fb2" } }
- extendedWaitUntil:
    visible: "Can't open this book"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 3. corrupt.mobi -> readable error, no crash (ERR-004)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "corrupt.mobi" } }
- extendedWaitUntil:
    visible: "Can't open this book"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 4/5. zipbomb.epub (ERR-005) / oversized.fb2 (ERR-006) — FIXED in v26 (commit 5472c85, "very
# large books fail with a message instead of running out of memory"). Previously (confirmed
# on-device, Tab_35_PixelTablet, 2026-11-09, full crash-report.txt/logcat in task-7a-report.md's
# Take 4 section) both fixtures crashed the whole app process with an uncaught OutOfMemoryError
# instead of showing an error dialog: readZipEntries's ByteArrayOutputStream (zipbomb) and
# Fb2DocumentBuilder.flush's StringBuilder.toString() (oversized.fb2) each needed ~1.5x the
# 300 MB MAX_DECOMPRESSED budget in contiguous heap to grow into, well past this device's
# ~192 MB default-process heap limit, so the 300 MB guard never got a chance to fire. The fix
# scales the effective budget down to a fraction of the real heap (effectiveMaxDecompressed(),
# StreamReading.kt) and gives FB2 its own per-book maxChars budget, so BookTooLargeException
# ("Book is too large to open safely.") now throws before either buffer can OOM. Both fixtures
# now import like any other bad file (steps 1-3/6-10's pattern): HomeErrorDialog shows the exact
# message, no crash, and neither consumes a free-tier slot.
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "zipbomb.epub" } }
- extendedWaitUntil:
    visible: "Book is too large to open safely."
    timeout: 30000
- tapOn: "OK"
- assertVisible: "Open book"
- assertVisible: "Your library is empty"

- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "oversized.fb2" } }
- extendedWaitUntil:
    visible: "Book is too large to open safely."
    timeout: 60000
- tapOn: "OK"
- assertVisible: "Open book"
- assertVisible: "Your library is empty"

# 6. short-header.epub -> no crash during format sniffing; a clear error is shown (ERR-008)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "short-header.epub" } }
- extendedWaitUntil:
    visible: "Can't open this book"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 7. huffcdic.mobi -> "This MOBI uses HUFF/CDIC compression, which isn't supported yet." (IMP-005)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "huffcdic.mobi" } }
- extendedWaitUntil:
    visible: "This MOBI uses HUFF/CDIC compression, which isn't supported yet."
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 8. kf8.azw3 -> "This looks like an AZW3/KF8 file, which isn't supported yet." (IMP-006)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "kf8.azw3" } }
- extendedWaitUntil:
    visible: "This looks like an AZW3/KF8 file, which isn't supported yet."
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 9. drm.mobi -> "This MOBI is DRM-protected and can't be opened." (IMP-007)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "drm.mobi" } }
- extendedWaitUntil:
    visible: "This MOBI is DRM-protected and can't be opened."
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 10. no-chapters.fb2 -> clear "no readable chapters" error; no empty book added (ERR-007)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "no-chapters.fb2" } }
- extendedWaitUntil:
    visible: "No chapters found in fb2 file"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Open book"

# 11. empty.epub -> parses, is added, auto-opens -> a visible message that the book has no
#     readable content, not a blank/white page (ERR-003)
- runFlow: { file: ../../subflows/pick_file.yaml, env: { FILE: "empty.epub" } }
- extendedWaitUntil:
    visible: "Nothing to read here"
    timeout: 20000
# Trailing .*: EmptyBookNotice's subtitle is ONE text node continuing past this sentence ("...
# It may contain only images or use a layout that isn't supported yet."); Maestro's text selector
# full-matches the whole node, same reasoning as J-LIB-01's dialog-body assertions.
- assertVisible: "This book has no text Mirrolit can show.*"
- runFlow: ../../subflows/back_to_library.yaml

# 12. Back to Library -> none of steps 1-10's files has a card; only empty.epub's "1 VOLUME"
# scrollUntilVisible, not a bare assertVisible: confirmed on-device (Pixel_10_Pro/API 37) that
# Home's "CONTINUE READING" hero (now showing the just-opened empty.epub) fills the whole phone
# viewport on its own - the "Your shelf · 1 VOLUME" header sits below the fold, hidden the same
# way every other phone-scroll fix in this suite documents (e.g. J-LIB-01's back_to_library
# "Open book" fix). scrollUntilVisible is a no-op on tablet, where the header is already on screen.
- scrollUntilVisible:
    element: "· 1 VOLUME"
    direction: DOWN
    timeout: 10000
- assertNotVisible: "corrupt"
- assertNotVisible: "No Qualifying Chapters"

# 13. Import alice-illustrated.epub and full-features.fb2 -> both import with no limit dialog
#     (failed imports above did not consume free slots)
# FIRST_TEXT is "So she was considering in her own mind", not the book's literal opening sentence
# - this edition's chapter 1 is unusually front-matter-heavy (cover/frontispiece/title page/spine
# art/list of illustrations) before the narrative; see J-LIB-01.yaml step 6 for the full on-device
# reasoning (same fixture, same fix).
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "alice-illustrated.epub"
      TITLE: "Alice.s Adventures in Wonderland"
      FIRST_TEXT: "So she was considering in her own mind"
# open_bars.yaml before back_to_library.yaml (not a change to that shared subflow): confirmed
# on-device that an extra `assertNotVisible` between import_book.yaml's own title check and
# back_to_library.yaml's first bars check can be enough wall-clock for
# READER_BARS_AUTO_HIDE_MS (3500ms) to fire again on this front-matter-heavy edition, same race
# as elsewhere in this suite; a no-op when bars are still up.
- assertNotVisible: "Library is full"
- runFlow: ../../subflows/open_bars.yaml
- runFlow: ../../subflows/back_to_library.yaml
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "full-features.fb2"
      TITLE: "The Complete Letters"
      FIRST_TEXT: "The letter arrived on a grey morning, long after everyone had stopped expecting it"
- assertNotVisible: "Library is full"
- runFlow: ../../subflows/open_bars.yaml
- runFlow: ../../subflows/back_to_library.yaml
# scrollUntilVisible, not a bare assertVisible: confirmed on-device (Pixel_10_Pro/API 37,
# `e2e/reports/20261113T065850Z`, step 340) that the just-opened "The Complete Letters" Continue
# Reading hero fills the whole phone viewport on its own, the same phone-only occlusion already
# documented at this flow's step 12 and throughout J-LIB-01/02 - the "Your shelf · 3 VOLUMES"
# header sits below the fold, hidden, not missing. A no-op on tablet, where the header is already
# on screen.
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 10000

# 14. Force-stop and relaunch -> app starts normally; the library is intact
# (Not launch_clean.yaml: that clears app state, which would wipe exactly the library we're
# checking survived a restart.)
- stopApp
- launchApp:
    clearState: false
# scrollUntilVisible, not a bare extendedWaitUntil: same phone-only Continue-Reading-hero
# occlusion as step 13's own check just above (a fresh relaunch reopens Home on the same hero) -
# a no-op on tablet.
- scrollUntilVisible:
    element: "· 3 VOLUMES"
    direction: DOWN
    timeout: 15000
