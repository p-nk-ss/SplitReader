# 10. Settings -> Language packs -> rows "EN → RU · N MB", "EN → DE · N MB", "EN → FR · N MB",
#     each with Delete; footer "Total <sum> MB · Models by Mozilla (MPL-2.0)" (OHQ-009).
#     Each row is its pack's bytes in whole MB, the total is the bytes' sum in whole MB: the
#     total is the three rows' sum, or up to 2 more (the rows' dropped fractions).
- runFlow: ../../subflows/leave_reader.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Total \\d+ MB · Models by Mozilla \\(MPL-2\\.0\\)"
    direction: DOWN
    timeout: 40000
- assertVisible: "Language packs"
- copyTextFrom: "EN → RU · \\d+ MB"
- evalScript: ${output.ru = parseInt(maestro.copiedText.split('· ')[1])}
- copyTextFrom: "EN → DE · \\d+ MB"
- evalScript: ${output.de = parseInt(maestro.copiedText.split('· ')[1])}
- copyTextFrom: "EN → FR · \\d+ MB"
- evalScript: ${output.fr = parseInt(maestro.copiedText.split('· ')[1])}
- copyTextFrom: "Total \\d+ MB · Models by Mozilla \\(MPL-2\\.0\\)"
- evalScript: ${output.total = parseInt(maestro.copiedText.split(' ')[1])}
- evalScript: ${console.log('J-TRN-03 packs - RU ' + output.ru + ', DE ' + output.de + ', FR ' + output.fr + ', total ' + output.total)}
- assertTrue: ${output.ru >= 10 && output.de >= 10 && output.fr >= 10}
- assertTrue: ${output.total >= output.ru + output.de + output.fr && output.total <= output.ru + output.de + output.fr + 2}
- assertVisible:
    text: "Delete"
    rightOf: "EN → RU · \\d+ MB"
- assertVisible:
    text: "Delete"
    rightOf: "EN → DE · \\d+ MB"
- assertVisible:
    text: "Delete"
    rightOf: "EN → FR · \\d+ MB"
- takeScreenshot: J-TRN-03-step10-language-packs

# 11. Delete on "EN → DE" -> that row disappears and the total drops at once, by that pack
#     (OHQ-011). The other two rows stay — the Delete that was tapped was EN → DE's.
- tapOn:
    text: "Delete"
    rightOf: "EN → DE · \\d+ MB"
- extendedWaitUntil:
    notVisible: "EN → DE · \\d+ MB"
    timeout: 5000
- assertVisible: "EN → RU · ${output.ru} MB"
- assertVisible: "EN → FR · ${output.fr} MB"
- copyTextFrom: "Total \\d+ MB · Models by Mozilla \\(MPL-2\\.0\\)"
- evalScript: ${output.total2 = parseInt(maestro.copiedText.split(' ')[1])}
- evalScript: ${console.log('J-TRN-03 packs - total after deleting DE ' + output.total2)}
- assertTrue: ${output.total2 >= output.ru + output.fr && output.total2 <= output.ru + output.fr + 1}
- assertTrue: ${output.total2 < output.total}
- takeScreenshot: J-TRN-03-step11-de-deleted

# 12. Back in the reader, switch the target to German -> a fresh download starts from the
#     beginning, with no leftover or corrupted state, and German appears when it finishes
#     (OHQ-011, OHQ-004). The banner is watched from its first appearance: its first percentage
#     is in the first quarter (a download resumed from a leftover would start high — the same
#     watch reads 0–7% first on a clean install), at least two readings are under 100, and
#     none is lower than one before it.
- tapOn: "Library"
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "translation_0_11"
    timeout: 30000
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:languageChip"
      OPENS: "Translate into"
- tapOn:
    text: "Deutsch"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "Preparing translation….*"
    timeout: 30000
- runFlow: ../../subflows/watch_translation_banner.yaml
- assertTrue: ${output.bnBelow100 >= 2}
- assertTrue: ${output.bnFirst >= 0 && output.bnFirst <= 25}
- assertTrue: ${output.bnDecreased == false}
- assertNotVisible: ".*(corrupt|Translation failed|TRANSLATION FAILED).*"
- runFlow:
    file: ../../subflows/rows_translated.yaml
    env:
      CHAPTER: 0
      FROM: 11
      PATTERN: ".*\\b(der|die|das|und)\\b.*"
      TIMEOUT: 120000
- assertTrue: "${output.rows >= (DEVICE_CLASS == 'tablet' ? 6 : 3)}"
- assertNotVisible:
    text: ".*[а-яё]{3,}.*"
    childOf:
      id: "translation_\\d+_\\d+"
- takeScreenshot: J-TRN-03-step12-german-again

# 13. The popup while its translation is still on the way (POP-010, POP-022, POP-021).
#     With an installed pack a word is translated in less than one Maestro command. A pack that
#     is not installed gives a window: for the 4–5 s of its download the popup of a pressed word
#     reads "Downloading language model… N%" — the Translating state. Two more targets are
#     chosen here for that, Spanish and Italian (neither pack is installed: step 10 listed RU,
#     DE and FR only). Everything inside a window is a point gesture (see the header; the bars
#     are up after the dialog, so the points are step 5's: "river" in paragraph 1, the word at
#     the same place in paragraph 2 — "the" on the tablet, "before" on the phone — a place in
#     the text of paragraph 3, and the popup's Save button, which with the bars up sits one
#     footer higher).
#     "Still on the way" is asked right after the gesture it is about: the popup must STILL
#     read "Downloading language model… N%". On a slow device or a fast network that line
#     fails — then nothing was proven and the step fails; it never passes by being late.
#     Back to chapter 1's top first, where the points are.
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:chaptersButton"
      OPENS: "Chapters"
- tapOn: ".*The Ferry"
- extendedWaitUntil:
    notVisible: "Chapters"
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*\\b(der|die|das|und)\\b.*"
      childOf:
        id: "translation_0_0"
    timeout: 120000
- assertVisible: "— 1 —"
#     13a. Spanish. Press "river"; while its popup still translates tap Save -> nothing happens:
#     the popup goes on translating (asked right after the tap), there is no "Saved to
#     dictionary" toast, and Words is still empty at the end of the journey (POP-010 "does
#     nothing when tapped"). "Greyed out": the Save text node reads enabled in every state, but
#     its parent — the button — reads enabled=false while there is no translation; that is
#     asserted here, and the opposite once "river" is translated (below). Then, the request
#     still in flight, tap elsewhere in the text -> the popup is dismissed; press the word in
#     paragraph 2 -> the popup is that word's and ends with that word's translation, not
#     "river"'s, with no error (POP-022).
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
