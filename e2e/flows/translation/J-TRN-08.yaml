appId: ${APP_ID}
name: J-TRN-08 Azure and Quick Translate fields and gating, no LibreTranslate
tags: [smoke, full, phone, tablet, network, translation, J-TRN-08]
# books: en-novel.epub, prose-one-chapter.epub
# Step 12 turns the device and switches aeroplane mode on: whatever happens in between, the
# flow ends online and in the orientation it started in (a failure there must not leave the
# emulator offline or turned for the flows after it).
onFlowComplete:
  - setAirplaneMode: disabled
  - setOrientation: PORTRAIT
---
# J-TRN-08 — Azure and Quick Translate: fields and gating; LibreTranslate is gone (v29).
# Fixtures: en-novel.epub ("The River Crossing": chapter 1 = 42 paragraphs "(1)"…"(42)",
# chapter 2 = 8 paragraphs "(ch2.1)"…) and prose-one-chapter.epub ("Prose in One Chapter": ONE
# chapter of 56 paragraphs "(s1)"…"(s56)", texts no other fixture has; never opened before step 13).
# Source of steps/checkpoints: docs/e2e/e2e_journeys.md J-TRN-08.
# Steps 3–5 (LibreTranslate's fields) were removed with LibreTranslate in versionCode 29; the
# other steps keep their numbers.
#
# MONEY and other people's servers. The only key typed is the made-up "fake-key-e2e-000".
# - Azure never gets a key: the app sends it nothing (it answers "key isn't set" itself).
# - Quick Translate needs no key and really translates (steps 10–13): about a hundred
#   paragraph requests in the whole flow, each made by reading, none in a loop.
#
# How the gate is seen (ONL-014, TRN-027). Every paragraph an engine translates is stored in
# the app's cache, shown or not; Settings -> "Cached translations: N" counts them
# (subflows/cached_translations.yaml). With the translation pane hidden,
# reading must leave N exactly as it was — Offline HQ, which is not gated, adds 13–23 over the
# same three screens (J-TRN-01 step 9), and so would a Quick Translate that worked in the
# background. After "Show translation" is switched on N must grow — read without a restart (SET-018).
# TRN-027's second half (what is translated after switching on is the screen and what follows,
# not the screens read while hidden): prose-one-chapter has 56 paragraphs in ONE chapter. The
# flow reads which paragraph is on top when the pane comes on (g, counted from 0), then reads to
# the end of the book. Translated by then: everything from 4 paragraphs above g
# (TranslationPlanner.LOOKBEHIND) to the end — at most 56 - g + 4. The lower end, 56 - g, is
# timing, not layout: the flow scrolls on before the look-behind has run (seen: g 31, growth 25).
# None of the book's paragraphs was stored before (its texts are in no other book). The flow
# allows 3 paragraphs of slack each way for the reading of g (the paragraph "on top" is the first
# English paragraph Maestro finds, which may be one or two rows off the planner's first visible
# item): it asserts 56 - g - 3 <= growth <= 56 - g + 4 + 3, with g >= 10.
# Why ONE chapter: the bug TRN-027 names is "translates the chapter behind it" — an engine that,
# when the pane comes on, also fills the current chapter from its start to the screen (the app has
# that path: "Translate the rest of this chapter" fills a chapter's untranslated runs from its
# first paragraph). In a book of 14-paragraph chapters such a fill adds only the top paragraph's
# place in its chapter (p), and the bound let p <= 7 through. Here the chapter behind is the whole
# hidden read: the fill stores all 56, and 56 > 63 - g for every g >= 8.
#
# ONL-023 (rotation): the shown paragraph must come back after each turn with the same text and
# without the network — the flow turns the device in aeroplane mode, where any new request for
# a shown paragraph would end in the "No internet" error banner.
#
# MANUAL / partial, declared here and in the journey text:
# - ONL-023 / TRN-027 / TRN-010 with a PAID engine: "the monthly usage counter does not grow"
#   needs a real key. MANUAL. (J-TRN-07 step 9a shows the same gate for DeepL through the
#   invalid-key banner.)
# - "The paragraphs further down show the translating placeholder first" (ONL-014, TRN-027): a
#   placeholder that lasts well under a second is not readable; the cache count stands for it.
# - ONL-012: field check only (Region is its own field and is stored); a real Azure translation
#   with a custom region needs a real key (J-TRN-12, manual).
# - ONL-021: best effort by nature — the unofficial endpoint may throttle (the app then retries).
# No `hideKeyboard` in this flow: a key dialog lifts itself above the keyboard (Save, Cancel and
# the error line stay in view on both device classes), the keyboard goes when the dialog closes,
# and with no keyboard up `hideKeyboard` is a Back press — it closed the picker (seen).
# The paragraph widths of step 12 are those of Tab_35_PixelTablet and Pixel_10_Pro at the
# default margin (J-RDR-03).
- assertTrue: ${DEVICE_CLASS == 'phone' || DEVICE_CLASS == 'tablet'}
- runFlow: ../../subflows/launch_clean.yaml

# Preconditions: Offline HQ current; no online keys saved.
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Manage providers.*"
    direction: DOWN
    timeout: 40000
- assertVisible:
    text: "Offline HQ"
    below: "Translation"
    above: "Manage providers.*"

# 1. Settings -> Translation -> Change -> the picker lists no LibreTranslate card: LibreTranslate
#    was removed in versionCode 29 (ONL-009/010/011 and SET-011 for LibreTranslate are retired;
#    the one-time "LibreTranslate is no longer supported" notice after an update is MANUAL —
#    it cannot be set up from a clean install). The advanced cards are Google Cloud, DeepL, Azure.
- tapOn:
    text: "Change"
    below: "Translation"
    above: "Manage providers.*"
- extendedWaitUntil:
    visible: "Choose provider"
    timeout: 10000
- assertNotVisible: ".*LibreTranslate.*"
- scrollUntilVisible:
    element:
      id: "translator_edit_azure"
    direction: DOWN
    timeout: 15000
- assertVisible: "Google Cloud Translation"
- assertVisible: "DeepL"
- assertNotVisible: ".*LibreTranslate.*"
- assertNotVisible:
    id: "translator_edit_libre_translate"
- takeScreenshot: J-TRN-08-step1-no-libretranslate-settings
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000

# 2. Open en-novel.epub -> translated by Offline HQ. The language picker ("To" tab) says where
#    the text goes and what the model is: "On-device translation · no cloud calls" and
#    "OFFLINE HQ · DOWNLOADED" (the EN→RU pack was just downloaded), nothing about an online
#    translator (since versionCode 29; v28 always said "ML KIT · DOWNLOADED"). The reader's
#    Translator picker has no LibreTranslate card either. (TRN-028)
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Open book"
    timeout: 10000
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "en-novel.epub"
      TITLE: "The River Crossing"
      FIRST_TEXT: "The old mill still stood at the bend of the river"
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_0"
    timeout: 240000
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:languageChip"
      OPENS: "Translate into"
- scrollUntilVisible:
    element: "no cloud calls"
    direction: DOWN
    timeout: 30000
- assertVisible: "OFFLINE HQ · DOWNLOADED"
- assertVisible: "On-device translation ·.*"
- assertNotVisible: ".*ML KIT.*"
- assertNotVisible: "Online translation.*"
- takeScreenshot: J-TRN-08-step2-strip-offline-hq
- back
- extendedWaitUntil:
    notVisible: "Translate into"
    timeout: 5000
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:translatorPickerButton"
      OPENS: "Choose provider"
- scrollUntilVisible:
    element:
      id: "translator_edit_azure"
    direction: DOWN
    timeout: 15000
- assertNotVisible: ".*LibreTranslate.*"
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000
- runFlow: ../../subflows/leave_reader.yaml

# 3.–5. (LibreTranslate's Server URL, cleartext, bare host and Clear — removed with
#    LibreTranslate in versionCode 29; numbers kept so the steps below keep theirs.)
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Manage providers.*"
    direction: DOWN
    timeout: 40000
- assertVisible:
    text: "Offline HQ"
    below: "Translation"
    above: "Manage providers.*"

# 6. Tap Azure -> the dialog has a separate "Region" field next to the API key (ONL-012, field
#    check). Enter only Region "westeurope", leave the key empty, Save.
#    The app accepts that (Save is enabled by the region alone, TranslatorPickerDialog.kt
#    ApiKeyDialog `saveEnabled`) and Azure becomes current without a key — the journey's first
#    branch; the card goes on saying TAP TO ADD API KEY.
- tapOn:
    text: "Change"
    below: "Translation"
    above: "Manage providers.*"
- extendedWaitUntil:
    visible: "Choose provider"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "translator_edit_azure"
    direction: DOWN
    timeout: 15000
- tapOn: "Azure Translator"
- extendedWaitUntil:
    visible: "Paste your Azure Translator API key. Keys are stored encrypted on this device."
    timeout: 10000
- assertVisible: "REGION"
- assertVisible: "Paste key…"
- assertVisible: "global"
- tapOn:
    text: "global"
    point: "95%, 50%"
- eraseText: 20
- inputText: "westeurope"
- assertVisible: "westeurope"
- assertVisible: "Paste key…"
- takeScreenshot: J-TRN-08-step6-azure-region-only
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 10000
- scrollUntilVisible:
    element: "Manage providers.*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "Azure Translator"
    below: "Translation"
    above: "Manage providers.*"
#    The region is stored on its own (the key is still missing): the dialog shows it again.
- tapOn:
    text: "Change"
    below: "Translation"
    above: "Manage providers.*"
- extendedWaitUntil:
    visible: "Choose provider"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "translator_edit_azure"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "TAP TO ADD API KEY"
    below: "Azure Translator"
- assertNotVisible: "KEY CONFIGURED"
- takeScreenshot:
    path: colour-check/step6-azure-current-without-key__PaperInk
    cropOn: "Azure Translator"
- tapOn:
    id: "translator_edit_azure"
- extendedWaitUntil:
    visible: "REGION"
    timeout: 10000
- assertVisible: "westeurope"
- assertVisible: "Paste key…"
- assertNotVisible: "Clear"
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "REGION"
    timeout: 5000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000

# 7. In the reader -> a clear "Azure Translator API key isn't set — tap Switch translator to
#    add it" error, never another engine's text labelled Azure (ONL-013, ONL-001).
- tapOn: "Library"
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible: "Azure Translator API key isn't set — tap Switch translator to add it"
    timeout: 60000
- assertVisible: "TRANSLATION FAILED"
- assertVisible: "Retry"
- assertVisible: "Switch translator"
- assertVisible:
    id: "translation_0_\\d+"
- assertNotVisible: ".*[А-Яа-яЁё]{3,}.*"
- assertNotVisible: "(Preparing translation|Translating)….*"
- takeScreenshot: J-TRN-08-step7-azure-key-not-set
#    The language picker ("To" tab) says the text goes to Microsoft Azure, with no model line
#    and no "no cloud calls" (since versionCode 29). Opening it sends and downloads nothing. (TRN-028)
#    The scroll gets 30 s: on the phone one swipe of the dialog took ~10 s to settle (run
#    20261116T155952Z: the 10 s timeout ran out after that one swipe, the strip on screen).
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:languageChip"
      OPENS: "Translate into"
- scrollUntilVisible:
    element: "Online translation · text is sent to Microsoft Azure"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "no cloud calls"
- assertNotVisible: "(OFFLINE HQ|ML KIT|AZURE TRANSLATOR) · .*"
- takeScreenshot: J-TRN-08-step7-strip-azure
- back
- extendedWaitUntil:
    notVisible: "Translate into"
    timeout: 5000

# 8. With Azure current and keyless, long-press a word and tap Save -> nothing is saved: the
#    popup shows "Azure Translator API key isn't set" (short form), its Save is disabled; a tap
#    on it is made, and Words gets no entry (POP-012, WRD-006; Words is read at the end).
- scrollUntilVisible:
    element:
      id: "original_0_11"
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: "reader:languageChip"
    timeout: 8000
- longPressOn:
    id: "original_0_11"
    point: "6%, 6%"
- extendedWaitUntil:
    visible: "Azure Translator API key isn't set"
    timeout: 30000
- assertVisible: "WORD"
- assertVisible:
    text: "Every"
    childOf:
      id: "reader:wordPopup"
- assertNotVisible: ".*[А-Яа-яЁё]{3,}.*"
- assertVisible:
    enabled: false
    containsChild:
      text: "Save"
- tapOn: "Save"
#    (No "there is no toast" line: `assertNotVisible` waits for a text to go, and a toast goes
#    by itself — the line passed after a real Save, broken copy fail07 F10b. That nothing was
#    saved is read in Words at the end of the flow, which does fail after a real Save: F10c.)
- assertVisible: "Azure Translator API key isn't set"
- takeScreenshot: J-TRN-08-step8-popup-key-not-set
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "WORD"
    timeout: 5000

# 9. Switch to Offline HQ via "Switch translator". Open the Translator picker and find Quick
#    Translate -> the note "Unofficial endpoint — may be rate-limited or break without notice."
#    is on its card (ONL-020).
- tapOn: "Switch translator"
- extendedWaitUntil:
    visible: "Choose provider"
    timeout: 10000
- scrollUntilVisible:
    element: "Offline HQ"
    direction: UP
    timeout: 15000
- tapOn: "Offline HQ"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_11"
    timeout: 240000
- assertNotVisible: "TRANSLATION FAILED"
#    Offline HQ's text of paragraph 12, to tell Quick Translate's from it in step 10.
- copyTextFrom:
    text: ".*[а-яё]{3,}.*"
    childOf:
      id: "translation_0_11"
- evalScript: ${output.hqText = maestro.copiedText}
- evalScript: ${console.log('J-TRN-08 paragraph 12, Offline HQ - ' + output.hqText)}
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:translatorPickerButton"
      OPENS: "Choose provider"
- scrollUntilVisible:
    element: "ADVANCED \\(OWN API KEY\\)"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Unofficial endpoint — may be rate-limited or break without notice\\."
    below: "Quick Translate \\(free, online\\)"
    above: "ADVANCED \\(OWN API KEY\\)"
- takeScreenshot: J-TRN-08-step9-quick-translate-note

# 10. Select Quick Translate -> the visible screen translates via Quick Translate; long-press a
#     word -> the popup returns a translation (ONL-021).
#     "Via Quick Translate": paragraph 12 is Russian again and its text is not Offline HQ's.
- tapOn: "Quick Translate \\(free, online\\)"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_11"
    timeout: 90000
- copyTextFrom:
    text: ".*[а-яё]{3,}.*"
    childOf:
      id: "translation_0_11"
- evalScript: ${output.qtText = maestro.copiedText}
- evalScript: ${console.log('J-TRN-08 paragraph 12, Quick Translate - ' + output.qtText)}
- assertTrue: ${output.qtText != output.hqText}
- assertNotVisible: "TRANSLATION FAILED"
#     "Not Offline HQ's text" is also what ML Kit would give, had Quick Translate not served and
#     the app fallen back: then the strip "… — translated by ML Kit" is under the top bar while the
#     bars are up (J-TRN-01 step 2's look). The language button right after it proves the bars
#     were still up when the strip was looked for.
- evalScript: ${output.qtStripAttempt = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.qtStripAttempt = output.qtStripAttempt + 1}
      - evalScript: ${console.log('J-TRN-08 step 10 no translated-by strip - attempt ' + output.qtStripAttempt)}
      - runFlow: ../../subflows/show_bars.yaml
      - assertNotVisible: ".*translated by.*"
      - assertVisible:
          id: "reader:languageChip"
- extendedWaitUntil:
    notVisible:
      id: "reader:languageChip"
    timeout: 8000
- longPressOn:
    id: "original_0_11"
    point: "6%, 6%"
- extendedWaitUntil:
    visible:
      text: "(?=.*[А-Яа-яЁё]).{1,40}"
      childOf:
        id: "reader:wordPopup"
    timeout: 60000
- assertVisible:
    text: "Every"
    childOf:
      id: "reader:wordPopup"
- takeScreenshot: J-TRN-08-step10-quick-translate
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "WORD"
    timeout: 5000

# 11. Aa -> "Show translation" off, scroll forward three screens, turn it back on -> the
#     screens scrolled while hidden had no translations made in the meantime: Quick Translate
#     needs the network, so it is gated like a paid engine (ONL-014).
#     The cache count (header): read with the pane already off (before), read again after three
#     screens and 8 s with the pane off (must be the same number), and once more after the pane
#     is on again and the screen is translated (must be more).
- runFlow:
    file: ../../subflows/show_translation.yaml
    env:
      STATE: "off"
- runFlow: ../../subflows/leave_reader.yaml
- runFlow: ../../subflows/cached_translations.yaml
- evalScript: ${output.c0 = output.cached}
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_0_\\d+"
    timeout: 20000
- assertNotVisible:
    id: "translation_\\d+_\\d+"
- repeat:
    times: 3
    commands:
      - swipe:
          start: "30%, 75%"
          end: "30%, 40%"
          duration: 1500
      - extendedWaitUntil:
          visible: "J-TRN-08 pause between screens"
          timeout: 3000
          optional: true
- extendedWaitUntil:
    visible: "J-TRN-08 pause before reading the cache"
    timeout: 8000
    optional: true
- assertNotVisible:
    id: "translation_\\d+_\\d+"
- assertNotVisible: "TRANSLATION FAILED"
- runFlow: ../../subflows/leave_reader.yaml
- runFlow: ../../subflows/cached_translations.yaml
- evalScript: ${output.c1 = output.cached}
- evalScript: ${console.log('J-TRN-08 step 11 - cached before ' + output.c0 + ', after three hidden screens ' + output.c1)}
- assertTrue: ${output.c1 == output.c0}
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_0_\\d+"
    timeout: 20000
- runFlow:
    file: ../../subflows/show_translation.yaml
    env:
      STATE: "on"
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_\\d+_\\d+"
    timeout: 90000
- extendedWaitUntil:
    visible: "J-TRN-08 pause while the window is translated"
    timeout: 10000
    optional: true
- assertNotVisible: "TRANSLATION FAILED"
- takeScreenshot: J-TRN-08-step11-pane-back
- runFlow: ../../subflows/leave_reader.yaml
- runFlow: ../../subflows/cached_translations.yaml
- evalScript: ${output.c2 = output.cached}
- evalScript: ${console.log('J-TRN-08 step 11 - cached after the pane came back ' + output.c2)}
- assertTrue: ${output.c2 > output.c1}

# 12. With Quick Translate still current and the screen translated, rotate there and back ->
#     the translated paragraphs reappear at once, with no translating placeholder: they come
#     from what the app already has, not from a new request (ONL-023).
#     The place: the start of chapter 1 (chapter picker), so that the paragraph on top is known
#     (original_0_0) — translated while online, 10 s for the window around it. Then aeroplane
#     mode on (10 s for the radios to go down), and the device is turned and turned back: after each turn paragraph "(1)" has
#     the same Russian text as before, and there is no error banner and no "Translating…" —
#     offline, a request for a shown paragraph could only fail, and each look comes 5 s after the
#     turn, when such a request has ended (proved by a broken copy that opens a chapter never
#     translated with the same pauses: the banner is seen). The turn itself is proven by the
#     paragraph's width (J-RDR-03's table).
#     Settings -> Orientation -> AUTO first, so the device may be turned. (Settings is where
#     cached_translations.yaml left it, at "Storage" near its end: Orientation is above.)
- tapOn: "Settings"
- scrollUntilVisible:
    element: "AUTO"
    direction: UP
    timeout: 40000
- tapOn: "AUTO"
- tapOn: "Library"
- scrollUntilVisible:
    element:
      id: "book_card_The River Crossing"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_The River Crossing"
- extendedWaitUntil:
    visible:
      id: "original_0_\\d+"
    timeout: 20000
- runFlow:
    file: ../../subflows/tap_reader_button.yaml
    env:
      BUTTON: "reader:chaptersButton"
      OPENS: "Chapters"
- tapOn:
    id: "reader:chapterRow:0"
- extendedWaitUntil:
    notVisible: "Chapters"
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_0"
    timeout: 90000
- extendedWaitUntil:
    visible: "J-TRN-08 pause while the window of chapter 1 is translated"
    timeout: 10000
    optional: true
- copyTextFrom:
    text: ".*[а-яё]{3,}.*"
    childOf:
      id: "translation_0_0"
- evalScript: ${output.rotBefore = maestro.copiedText}
- evalScript: ${console.log('J-TRN-08 step 12 - before the turns - ' + output.rotBefore)}
- setAirplaneMode: enabled
#     The radios go down some time after the command returns (it returns in ~30 ms): 10 s before
#     the first turn, the time after which a request offline was seen to end in the error banner.
- extendedWaitUntil:
    visible: "J-TRN-08 pause for aeroplane mode to take the network down"
    timeout: 10000
    optional: true
#     On the tablet (natural orientation landscape) LANDSCAPE_LEFT is the turn to portrait.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_0"
    timeout: 5000
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'phone'}
    commands:
      - assertVisible:
          id: "original_0_0"
          width: 1218
          tolerance: 6
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'tablet'}
    commands:
      - assertVisible:
          id: "original_0_0"
          width: 712
          tolerance: 6
#     5 s after the turn, offline: a request made for the turn has ended by now (offline it fails
#     at once), so "Translating…" cannot be one still in flight, and its error banner is up.
- extendedWaitUntil:
    visible: "J-TRN-08 pause after the turn, offline"
    timeout: 5000
    optional: true
- copyTextFrom:
    text: ".*[а-яё]{3,}.*"
    childOf:
      id: "translation_0_0"
- assertTrue: ${maestro.copiedText == output.rotBefore}
- assertNotVisible: "(Preparing translation|Translating)….*"
- assertNotVisible: "TRANSLATION FAILED"
- takeScreenshot: J-TRN-08-step12-turned-offline
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_0"
    timeout: 5000
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'phone'}
    commands:
      - assertVisible:
          id: "original_0_0"
          width: 1088
          tolerance: 6
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'tablet'}
    commands:
      - assertVisible:
          id: "original_0_0"
          width: 1192
          tolerance: 6
#     5 s after the turn, offline: a request made for the turn has ended by now (offline it fails
#     at once), so "Translating…" cannot be one still in flight, and its error banner is up.
- extendedWaitUntil:
    visible: "J-TRN-08 pause after the turn, offline"
    timeout: 5000
    optional: true
- copyTextFrom:
    text: ".*[а-яё]{3,}.*"
    childOf:
      id: "translation_0_0"
- assertTrue: ${maestro.copiedText == output.rotBefore}
- assertNotVisible: "(Preparing translation|Translating)….*"
- assertNotVisible: "TRANSLATION FAILED"
- setAirplaneMode: disabled

# 13. Turn "Show translation" off, go back to the Library and open prose-one-chapter.epub (never
#     opened); scroll three screens. Turn "Show translation" on, then read on to the end ->
#     the visible screen translates; nothing was translated in the background while hidden,
#     and nothing of what was read while hidden is filled in afterwards (TRN-027; header).
- runFlow:
    file: ../../subflows/show_translation.yaml
    env:
      STATE: "off"
- runFlow: ../../subflows/leave_reader.yaml
- runFlow: ../../subflows/cached_translations.yaml
- evalScript: ${output.cX = output.cached}
- runFlow:
    file: ../../subflows/import_book.yaml
    env:
      FILE: "prose-one-chapter.epub"
      TITLE: "Prose in One Chapter"
      FIRST_TEXT: "The old mill still stood at the bend of the river"
- assertVisible: ".*\\(s1\\)"
- assertNotVisible:
    id: "translation_\\d+_\\d+"
- repeat:
    times: 5
    commands:
      - swipe:
          start: "30%, 80%"
          end: "30%, 25%"
          duration: 1500
      - extendedWaitUntil:
          visible: "J-TRN-08 pause between screens of prose-one-chapter"
          timeout: 3000
          optional: true
- extendedWaitUntil:
    visible: "J-TRN-08 pause before reading the cache again"
    timeout: 8000
    optional: true
- assertNotVisible:
    id: "translation_\\d+_\\d+"
- assertNotVisible: ".*[А-Яа-яЁё]{3,}.*"
- assertNotVisible: "TRANSLATION FAILED"
- runFlow: ../../subflows/leave_reader.yaml
- runFlow: ../../subflows/cached_translations.yaml
- evalScript: ${output.cY = output.cached}
- evalScript: ${console.log('J-TRN-08 step 13 - cached before prose-one-chapter ' + output.cX + ', after reading it hidden ' + output.cY)}
- assertTrue: ${output.cY == output.cX}
- scrollUntilVisible:
    element:
      id: "book_card_Prose in One Chapter"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "book_card_Prose in One Chapter"
- extendedWaitUntil:
    visible:
      id: "original_\\d+_\\d+"
    timeout: 20000
- runFlow:
    file: ../../subflows/show_translation.yaml
    env:
      STATE: "on"
#     The visible screen translates now.
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_\\d+_\\d+"
    timeout: 90000
#     Which paragraph is on top: the first English paragraph on screen (a translation starts
#     with a Cyrillic letter); its text ends "(sN)"; g = N - 1. The reading
#     with the pane hidden must have gone well past the first screen for the bound to mean
#     anything: g >= 10.
- copyTextFrom:
    text: "[A-Z][a-z]+ .*\\(s\\d+\\)"
- evalScript: ${output.topText = maestro.copiedText}
- evalScript: ${console.log('top paragraph - ' + output.topText)}
- evalScript: ${output.paraNo = parseInt(output.topText.substring(output.topText.lastIndexOf('(s') + 2, output.topText.lastIndexOf(')')))}
- assertTrue: ${output.paraNo >= 1 && output.paraNo <= 56}
- evalScript: ${output.g = output.paraNo - 1}
- evalScript: ${console.log('J-TRN-08 step 13 - on top when the pane came on - paragraph ' + output.g + ' of 56')}
- assertTrue: ${output.g >= 10}
- scrollUntilVisible:
    element:
      id: "translation_0_55"
    direction: DOWN
    timeout: 120000
- extendedWaitUntil:
    visible:
      text: ".*[а-яё]{3,}.*"
      childOf:
        id: "translation_0_55"
    timeout: 90000
- extendedWaitUntil:
    visible: "J-TRN-08 pause while the last window is translated"
    timeout: 10000
    optional: true
- assertNotVisible: "TRANSLATION FAILED"
- takeScreenshot: J-TRN-08-step13-end-of-the-book
- runFlow: ../../subflows/leave_reader.yaml
- runFlow: ../../subflows/cached_translations.yaml
- evalScript: ${output.cZ = output.cached}
- evalScript: ${console.log('J-TRN-08 step 13 - cached after the pane came on and the book was read to its end ' + output.cZ + ' (grew by ' + (output.cZ - output.cY) + ', bound ' + (63 - output.g) + ')')}
- assertTrue: ${output.cZ - output.cY >= 56 - output.g - 3}
- assertTrue: ${output.cZ - output.cY <= 63 - output.g}

# 14. Select Offline HQ again (Settings); Quick Translate never had a usage line; nothing was
#     saved to Words by the Save tap of step 8. (Settings is at "Storage": Translation is above.
#     Scrolling up stops as soon as the card's last line is in view; on the phone the
#     "Translation" heading is then still above the screen and the `below:` check cannot hold —
#     seen 2026-11-16, run 20261116T002150Z. So the heading is scrolled to, then the card's end.)
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Translation"
    direction: UP
    timeout: 40000
- scrollUntilVisible:
    element: "Manage providers.*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "Quick Translate \\(free, online\\)"
    below: "Translation"
    above: "Manage providers.*"
- tapOn:
    text: "Change"
    below: "Translation"
    above: "Manage providers.*"
- extendedWaitUntil:
    visible: "Choose provider"
    timeout: 10000
#     "No usage line" is true by construction (QUICK_TRANSLATE.tracksUsage = false): the line below
#     cannot fail and is not evidence of anything; it only keeps the picker's look in the record.
- assertNotVisible: ".*THIS MONTH.*"
- tapOn: "Offline HQ"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000
- assertVisible:
    text: "Offline HQ"
    below: "Translation"
    above: "Manage providers.*"
- tapOn: "Words"
- extendedWaitUntil:
    visible: "No saved words yet"
    timeout: 10000
