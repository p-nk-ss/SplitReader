appId: ${APP_ID}
---
# cached_translations: reads Settings -> Storage -> "Cached translations: N" into output.cached
# and returns to the Library. Every translated paragraph is stored in the app's cache whether or
# not it was ever on screen, so the number tells what the reader's engine translated — the only
# way a flow can see work done off screen (look-ahead below the page, a hidden translation pane).
#
# The app is NOT restarted: since versionCode 29 Settings follows the count live
# (SettingsViewModel collects TranslationRepository.cachedCount()). Up to versionCode 28 it read
# the number once per process and showed it on every later visit, and this subflow restarted the
# app first (stopApp + launchApp) — without that a second call returned the first call's count
# although 30 more paragraphs had been translated in between (Tab_35_PixelTablet, 2026-11-15).
# The restart is gone so the journeys see the live number; on a v28 build the second call of a
# journey is stale again and its "the count grew" check fails (seen: Task 9d, J-TRN-01 step 9).
# Call it from the Library, after the reader was left (its position is saved by then).
# Ends on the Library at "Open book".
- extendedWaitUntil:
    visible: "Open book"
    timeout: 15000
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Cached translations: \\d+"
    direction: DOWN
    timeout: 40000
- copyTextFrom: "Cached translations: \\d+"
- evalScript: "${output.cached = parseInt(maestro.copiedText.replace(/[^0-9]/g, ''))}"
- evalScript: ${console.log('cached_translations - ' + output.cached)}
- tapOn: "Library"
- scrollUntilVisible:
    element: "Open book"
    direction: UP
    timeout: 10000
