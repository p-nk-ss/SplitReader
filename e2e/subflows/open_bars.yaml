appId: ${APP_ID}
---
# open_bars: makes sure the reader's chrome (top bar + footer) is showing, then asserts the
# clickable language chip is visible.
#
# A tap on the page content TOGGLES the bars (ReaderScreen.kt) - if they're already visible
# (e.g. right after opening a book, or right after import_book) a blind tap would hide them
# instead of showing them. So this only taps when the chip is not already there (idempotent:
# safe to call whether bars are currently shown or hidden).
#
# Asserted by id (reader:languageChip), never by the "EN -> RU" text: the reader's bottom-bar
# footer renders the identical substring "EN -> RU" in a separate, non-clickable TextView, and
# text-matching finds that one first (see task-1-report.md lines 71-72 / task-3-report.md's
# READER_LANGUAGE_CHIP tag, added exactly to avoid this collision).
#
# The tap point is "50%, 20%" (near the TOP of the page), not dead-center: on a phone's stacked
# vertical layout (VerticalBookSpread - original pane above, translation pane below, short pages)
# the screen's vertical center can land in the blank padding after a pane's last paragraph and
# before the next pane/divider, which isn't a registered tap target - a tap there has no effect
# at all (confirmed on Pixel_10_Pro/API 37, 2026-11-08: Maestro's own log showed no "UI changed"
# after that tap, and the chip assertion then timed out for the full 5s, not a near-miss). The
# first paragraph is always near the top of the page, on every layout (phone stacked or
# tablet side-by-side), so "20%" reliably lands on real paragraph content instead.
# Fix round 1 (2026-11-08, Task 7a): timeout raised 5000 -> 15000. A freshly-opened book with the
# default Offline HQ translator can still show a "Preparing translation… N%" banner in place of
# the normal top bar for a few seconds after the first paragraph's text is already on screen
# (confirmed on-device: the languageChip genuinely isn't composed yet while that banner is up,
# not a tap that silently failed) - 5s was occasionally too tight for that banner to clear under
# load.
#
# Fix round 2 (2026-11-09, Task 7a "Take 2"): a single fixed tap point is only reliable when the
# caller is known to be scrolled near the top of the chapter (the scenario round 1's "20%" was
# tuned against - right after import, before any scroll). A caller that scrolls first (e.g.
# import_book.yaml's scrollUntilVisible for FIRST_TEXT, which can land anywhere in the chapter)
# leaves the scroll position unpredictable, and "20%" can then land in blank inter-paragraph
# padding or on a non-text element (a chapter-heading rule, a drop-cap image) instead of real
# paragraph text - confirmed on-device (Pixel_10_Pro/API 37, phone stacked layout, scrolled well
# into chapter 2 by a preceding scrollUntilVisible): the chip never appeared within 15s at "20%"
# from that scroll position, and a screenshot showed the tap point sitting in exactly such a gap.
# Retrying at two more, widely-spaced points (50%, 80%) makes it very unlikely all three land in
# blank/non-text space at once, without needing to know or control the caller's scroll position.
# Each attempt is gated on notVisible (idempotent - a no-op once any earlier attempt already
# revealed the chip).
#
# Fix round 5 (2026-11-09, phone pass): the gap after each tap is now a soft, POLLING
# extendedWaitUntil for the chip itself (optional: true, so it warns and moves on instead of
# failing the flow), not a flat waitForAnimationToEnd. Confirmed on-device (Pixel_10_Pro/API 37)
# that the flat-2000ms version was a real double-tap-undo bug, not just a theoretical risk the
# old comment flagged: in a captured trace the chapter-2 masthead ("— 2 —"/title/rule, which
# ChapterMasthead renders with no tap handler at all - confirmed in ReaderChrome.kt/
# VerticalBookSpread.kt, unlike every paragraph/image/divider, which all wire onTap ->
# onToggleBars) ate the "20%" tap as a true no-op, "50%" landed on real paragraph text and DID
# toggle the bars on, but the chip had not finished composing by the fixed 2000ms mark under
# real translation load - so the "80%" gate still read notVisible, fired anyway, landed on real
# (translated) text in the bottom pane, and toggled the bars straight back off. All three taps
# showed as genuinely fired in that trace, and the final 15s wait below still failed outright
# (not a near-miss), because nothing was left to tap again. A polling wait returns the moment the
# chip actually appears instead of guessing a fixed delay, so a tap that DID work is never
# undone by the next fallback - it only ever fires when the chip is still genuinely absent after
# waiting. 2500ms per attempt keeps two full attempts' worth of margin under
# READER_BARS_AUTO_HIDE_MS = 3500ms.
- runFlow:
    when:
      notVisible:
        id: "reader:languageChip"
    commands:
      - tapOn:
          point: "50%, 20%"
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 2500
    optional: true
- runFlow:
    when:
      notVisible:
        id: "reader:languageChip"
    commands:
      - tapOn:
          point: "50%, 50%"
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 2500
    optional: true
- runFlow:
    when:
      notVisible:
        id: "reader:languageChip"
    commands:
      - tapOn:
          point: "50%, 80%"
# Fix round 4 (2026-11-09, phone pass): dropped the "Fix round 3" `when: visible: "WORD"`
# recovery block that used to sit right here. Confirmed on-device (Pixel_10_Pro/API 37, this
# session): a `when:` block whose condition evaluates to false (nothing to do - the common case,
# since the taps above virtually always land on real content, not a word) still costs several
# real seconds of wall-clock before Maestro concludes there's nothing to run - commands.json
# showed this exact WORD block logged "status": "SKIPPED" with "duration": 7080 (and an unrelated
# skipped `when` block elsewhere in the same run logged 7072) with NOTHING inside it executed.
# Against READER_BARS_AUTO_HIDE_MS = 3500ms, that alone is enough to let the chip that the last
# point-tap above just revealed auto-hide again before the terminal assertCondition below ever
# gets a chance to sample it - the three point-taps all independently proved out as genuinely
# working (each showed as the gate's own nested tap actually firing, not an "element not found"
# failure) in the on-device trace that first exposed this bug; it was this block's cost between
# the last tap and the terminal check that turned a real success into a reported failure. The
# edge case this used to defend (a reveal tap lands on a word and opens the translation popup
# instead - confirmed once on-device for the identical gesture in back_to_library.yaml) is now
# undefended here; if it recurs, the terminal assertCondition below will fail the test with a
# "Preparing"/word-popup screenshot rather than silently covering for it, which is an acceptable
# trade for not systematically breaking the common case.
- extendedWaitUntil:
    visible:
      id: "reader:languageChip"
    timeout: 15000
