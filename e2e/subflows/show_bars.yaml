appId: ${APP_ID}
---
# show_bars: shows the reader's bars (top bar + footer) for a caller that is about to read the
# footer or the title — without a `when:` block. The only way the suite shows the bars; a top-bar
# button is tapped through tap_reader_button.yaml, Back through leave_reader.yaml.
#
# The bars hide by themselves 3.5 s after they appear (READER_BARS_AUTO_HIDE_MS), and a tap on the
# page TOGGLES them, so a blind tap can hide bars that were up. Asking first ("are the bars up?")
# with `when: notVisible:` does not work: while the element is visible Maestro keeps waiting for
# it to disappear before it answers — measured ~4 s, 5–10 s under host load (Pixel_10_Pro,
# e2e/reports/20261114T134215Z: a SKIPPED `when` took 9977 ms) — which is as long as the bars need
# to hide by themselves, so the answer comes back "not visible" and the tap that follows hides
# nothing or shows them too late for the caller. (That was open_bars.yaml, removed 2026-11-14.)
#
# This subflow never asks: it first waits for the bars to be hidden (if they are up, their own
# timer hides them within 3.5 s), then sends ONE point tap that does not wait for the screen to
# settle, and waits for the bars. The language chip is the sign, by id (reader:languageChip): the
# footer repeats the same "EN → RU" text in another node. A tap on a paragraph, a chapter title,
# a picture or empty page space toggles the bars; "30%, 30%" is on the page in both layouts (left
# pane on a tablet, top pane on a phone) and never on the tablet's divider (x = 50%).
#
# One tap was once seen to do nothing (Pixel_10_Pro under host load, straight after a swipe,
# e2e/reports/20261114T140108Z: no bars for 5 s after it; the same sequence worked four times in
# a re-try), so the whole sequence is a `retry`: a failed attempt starts again from "wait until
# the bars are hidden", and so can never hide bars that the attempt before did show.
# Do NOT turn this into `repeat: while: notVisible:` either (tried: e2e/reports/20261114T141349Z,
# three taps in a row, each undoing the one before).
#
# The reader must already be open (the tap would otherwise land on whatever screen is there), and
# no dialog may cover it (dismiss_portrait_hint.yaml first on a path that can show the hint).
# The caller has about 3 s after this returns: do the footer or title check next.
- retry:
    maxRetries: 2
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "reader:languageChip"
          timeout: 10000
      - tapOn:
          point: "30%, 30%"
          waitToSettleTimeoutMs: 100
      - extendedWaitUntil:
          visible:
            id: "reader:languageChip"
          timeout: 4000
