appId: ${APP_ID}
---
# back_to_library_from_catalog: like back_to_library.yaml, but for a reader opened straight from
# the Catalog (CatalogViewModel.downloadAndOpen navigates Catalog -> reader directly, never
# through Home) - confirmed on-device (Tab_35_PixelTablet, 2026-11-09): the reader's Back button
# returns to whichever screen opened it (standard back-stack behaviour), which is Catalog here,
# not Home/Library. back_to_library.yaml's own final check (`scrollUntilVisible: "Open book"`)
# then fails outright, because that button only exists on Home. Not a fix to the shared subflow
# (J-LIB-01's picker-opened books really do return to Home via Back, and must keep working
# unchanged) - a separate subflow for this journey's different entry point instead.
#
# Fix round 1 (2026-11-10): same READER_BARS_AUTO_HIDE_MS (3500ms) race as back_to_library.yaml's
# own "Fix round 4" (see that file's comment for the full on-device evidence), now confirmed here
# too (Tab_35_PixelTablet, 2026-11-10, under heavy host load): a plain non-optional 5000ms wait +
# single tap left this subflow's "Library" step failing with "Element not found", the failure
# screenshot showing the reader STILL open (ordinary chapter content, no bars) - the reveal tap
# never actually got the flow back to Catalog. Hardened the same way: both waits below are
# `optional: true`, and the whole reveal-then-tap sequence is retried before the final "Library"
# tap and Home check.
#
# Fix round 2 (2026-11-10, same session): one retry still wasn't always enough under sustained
# heavy host load (confirmed on-device, Tab_35_PixelTablet: `top` load average 6-14 throughout
# this session) - widened to 2 retries (3 attempts total), and the final "Library" tap is now
# itself gated the same way (soft wait + optional tap + one more reveal-and-retry) instead of a
# bare non-optional tapOn, since a 3rd attempt reaching this point still needs the same race
# protection the earlier attempts had.
- runFlow:
    when:
      notVisible:
        id: "reader:backButton"
    commands:
      - tapOn:
          point: "50%, 20%"
- extendedWaitUntil:
    visible:
      id: "reader:backButton"
    timeout: 8000
    optional: true
- tapOn:
    id: "reader:backButton"
    optional: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: "Library"
    commands:
      - runFlow:
          when:
            notVisible:
              id: "reader:backButton"
          commands:
            - tapOn:
                point: "50%, 20%"
      - extendedWaitUntil:
          visible:
            id: "reader:backButton"
          timeout: 8000
          optional: true
      - tapOn:
          id: "reader:backButton"
          optional: true
      - extendedWaitUntil:
          visible: "Library"
          timeout: 5000
          optional: true
- runFlow:
    when:
      notVisible: "Library"
    commands:
      - runFlow:
          when:
            notVisible:
              id: "reader:backButton"
          commands:
            - tapOn:
                point: "50%, 20%"
      - extendedWaitUntil:
          visible:
            id: "reader:backButton"
          timeout: 8000
          optional: true
      - tapOn:
          id: "reader:backButton"
          optional: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- tapOn: "Library"
- scrollUntilVisible:
    element: "Open book"
    direction: UP
    timeout: 10000
