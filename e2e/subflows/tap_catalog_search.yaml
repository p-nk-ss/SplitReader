appId: ${APP_ID}
---
# tap_catalog_search: focuses the Catalog screen's search field and clears any text already in
# it. The clear matters for any journey with more than one search in a session: uiState.query is
# ViewModel state, so it survives navigating away to the reader and back - confirmed on-device
# (Tab_35_PixelTablet, 2026-11-09) that a second `inputText` without clearing first APPENDS to the
# previous query (e.g. "Pride and PrejudiceWalden"), silently turning the next search into one
# that matches nothing ("No books found") instead of the intended query. `eraseText` is a no-op
# on an already-empty field, so this is safe for a journey's first search too.
#
# v26 fix (CatalogScreen.kt, commit d39b6ec): the "Search by title or author…" placeholder is
# now real text INSIDE the field's own decoration box - but ONLY while the query is empty; once
# text has been typed, the placeholder is gone and nothing marks the field by stable text.
# Confirmed on-device (Tab_35_PixelTablet, 2026-11-10): a plain `tapOn` by the placeholder works
# for a session's FIRST search (field starts empty) but failed with "Element not found" on a
# LATER search in the same flow, because CatalogViewModel's query state persists across
# navigation (see this flow's own note on `eraseText`) and nothing re-empties the field between
# one search and the next UNTIL this subflow's own `eraseText` below runs - which happens only
# after the tap that focuses the field, too late to help the tap itself. Fix: try the placeholder
# text first (the common/fast case), fall back to the pre-v26 position-based selector (below the
# "Google Drive" pill, right of "Open Library") when the placeholder isn't showing - that
# selector targets layout position, not text, so it still works regardless of the field's
# current content.
- runFlow:
    when:
      visible: "Search by title or author…"
    commands:
      - tapOn: "Search by title or author…"
- runFlow:
    when:
      notVisible: "Search by title or author…"
    commands:
      - tapOn:
          below: "Google Drive"
          rightOf: "Open Library"
- eraseText
