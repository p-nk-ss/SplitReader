appId: ${APP_ID}
---
# import_book (env FILE, TITLE, FIRST_TEXT): picks ${FILE} in the system picker, gets the phone's
# portrait hint out of the way ("Don't show again" ticked) and proves the RIGHT book opened — by
# its first text AND by its title in the reader's top bar. Both are required: several fixtures
# share an opening line under different titles (seven open "The old mill still stood at the bend
# of the river…"), so the text alone would let a wrong pick through.
#
# Order matters. ${FIRST_TEXT} is checked first: a paragraph does not depend on the bars, so it
# survives however long parsing takes. It is a scrollUntilVisible because a book can open on
# pictures (alice-illustrated.epub: cover, frontispiece, title page) with its first text below
# the screen; 120 s because a freshly booted emulator scrolls slowly through full-page pictures.
# The title is in the top bar, which hides by itself 3.5 s after it appears, so it is read
# straight after show_bars.yaml, and the pair is a `retry` (see show_bars.yaml for why there is
# no `when: notVisible:` here).
#
# The portrait hint is dismissed twice: it can come up a moment after the first call found
# nothing, and its scrim then swallows every scroll (Pixel_10_Pro, e2e/reports/20261111T091606Z).
#
# Ends with the bars showing (for about 3 s). Do not tap a top-bar button by id next — use
# tap_reader_button.yaml, which shows the bars again itself.
- runFlow:
    file: pick_file.yaml
    env:
      FILE: ${FILE}
- runFlow: dismiss_portrait_hint.yaml
- runFlow: dismiss_portrait_hint.yaml
- scrollUntilVisible:
    element: ".*${FIRST_TEXT}.*"
    direction: DOWN
    timeout: 120000
- retry:
    maxRetries: 2
    commands:
      - runFlow: show_bars.yaml
      - extendedWaitUntil:
          visible: ".*${TITLE}.*"
          timeout: 3000
