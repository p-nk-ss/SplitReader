appId: ${APP_ID}
---
# set_translator (env NAME): opens the reader's translator picker and selects the provider whose
# card shows ${NAME} (TranslationProvider.displayName, domain/model/TranslationProvider.kt -
# "ML Kit (offline)", "Offline HQ", "Quick Translate (free, online)", "LibreTranslate",
# "Google Cloud Translation", "DeepL", "Azure Translator").
#
# ProviderRow's whole card is clickable (TranslatorPickerDialog.kt: `.clickable(onClick =
# onSelect)`), so tapping the displayName text selects it directly for an already-configured
# free/no-setup provider. An unconfigured ADVANCED provider (own API key) opens the key-entry
# dialog instead of selecting - that flow is intentionally out of scope here; use this subflow
# only for providers already usable (ML Kit, Offline HQ, Quick Translate, or an advanced
# provider whose key was already saved).
#
# ${NAME} is matched as a Maestro text pattern, not a literal string: wrap it in ".*...*" if it
# is only part of the displayName, and escape any regex metacharacters in it yourself (e.g. the
# parentheses in "ML Kit \\(offline\\)" or "Quick Translate \\(free, online\\)").
#
# The picker button is in the top bar, which hides by itself after 3.5 s: it is tapped through
# tap_reader_button.yaml (show the bars, tap, wait for the dialog — retried), never after a
# `when: notVisible:` question (see show_bars.yaml).
- runFlow:
    file: tap_reader_button.yaml
    env:
      BUTTON: "reader:translatorPickerButton"
      OPENS: "Choose provider"
- tapOn: "${NAME}"
- extendedWaitUntil:
    notVisible: "Choose provider"
    timeout: 5000
