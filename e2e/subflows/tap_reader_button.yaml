appId: ${APP_ID}
---
# tap_reader_button (env BUTTON, OPENS): taps a button of the reader's top bar by its id
# (reader:chaptersButton, reader:bookmarksButton, reader:displaySettingsButton,
# reader:translatorPickerButton) and waits for the text ${OPENS} that only the opened dialog shows
# ("Chapters", "Bookmark this page|Remove bookmark here", "Display", "Choose provider").
# ${OPENS} must not be the button's own content description: the bookmarks icon is "Bookmarks",
# the same text as its dialog's title, so "Bookmarks" is on screen whenever the bars are.
#
# Why not show_bars + a plain tapOn: the bars hide by themselves 3.5 s after they appear, and on
# a freshly booted or loaded emulator one `tapOn: id:` was measured at 6.5 s (Pixel_10_Pro,
# e2e/reports/20261114T133742Z): the bars were gone when the touch landed, the tap hit the page
# instead and no dialog opened. So the attempt is a `retry`, up to three more times, each from a
# fresh show_bars.yaml (which starts from the bars hidden, so a stray tap of the attempt before
# cannot confuse it).
# Every attempt is written to the log ("tap_reader_button <id> - attempt N"); e2e/report.py lists the
# attempts after the first under "Retries" in summary.md, so a button that regularly needs two taps
# does not stay hidden behind the retry.
- evalScript: ${output.tapButtonAttempt = 0}
- retry:
    maxRetries: 3
    commands:
      - evalScript: ${output.tapButtonAttempt = output.tapButtonAttempt + 1}
      - evalScript: ${console.log('tap_reader_button ' + BUTTON + ' - attempt ' + output.tapButtonAttempt)}
      - runFlow: show_bars.yaml
      - tapOn:
          id: "${BUTTON}"
      - extendedWaitUntil:
          visible: "${OPENS}"
          timeout: 4000
