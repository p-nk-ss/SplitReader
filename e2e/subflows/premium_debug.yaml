appId: ${APP_ID}
---
# premium_debug: Settings -> scroll to the debug-only "Premium (debug)" row (R.string
# .settings_debug_premium, BuildConfig.DEBUG only, SettingsScreen.kt) -> toggle it on -> assert
# the Premium section's status line flipped to "Premium active ... ".
#
# The toggle itself is tapped by id (`settings_debug_premium_switch`,
# SETTINGS_DEBUG_PREMIUM_SWITCH_TAG), a Task-5 addition to `ToggleRow` in
# `presentation/ui/SettingsControls.kt` (an optional `tag: String? = null` param on the Switch,
# matching `SliderRow`'s existing convention - no behaviour change, proven by the Settings/
# TestTagsAsResourceId unit tests and a warm `verifyRoborazziDebug` staying green).
#
# Why a position-based selector was rejected: before this tag existed, the only way to address
# this bare, label-less Switch was `below: "Debug", rightOf: "Premium (debug)"`. That selector
# FAILED INTERMITTENTLY in this task's own testing (Tab_26_Nexus9, 2026-11-08): on an AVD skin
# with an on-screen 3-button navigation bar, that bar's own Back button (package
# com.android.systemui, near the bottom of the WHOLE screen) ALSO satisfies "below Debug" and
# "rightOf Premium (debug)". Adding `index: 0` "fixed" it by relying on an *observed*, not
# guaranteed, traversal order (app content before the systemui overlay) - a real testTag removes
# the ambiguity rather than papering over it.
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "settings_debug_premium_switch"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings_debug_premium_switch"
- extendedWaitUntil:
    visible: ".*Premium active.*"
    timeout: 10000
