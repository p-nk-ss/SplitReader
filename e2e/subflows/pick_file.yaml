appId: ${APP_ID}
---
# pick_file (env FILE): taps "Open book" and selects ${FILE} (a filename, e.g.
# "mixed-lang.epub") in Android's system file picker. ${FILE} must already be pushed to
# /sdcard/Download/${FILE} and media-scanned (the picker only lists what the MediaStore/indexer
# already knows about - see the per-API scan commands in task-5-report.md).
#
# Observed on 2026-11-08, two different picker apps across the required/targeted emulators:
#   - Tab_35_PixelTablet (API 35) and the phone (Pixel_10_Pro): `com.google.android.documentsui`
#     opens straight onto a "Recent" list that already shows ${FILE} - the direct tap below
#     finds and taps it immediately, no drawer navigation needed.
#   - Tab_26_Nexus9 (API 26): AOSP `com.android.documentsui`. On a genuinely fresh picker
#     (confirmed via `emulator -wipe-data`) "Recent" is empty ("No items") and ${FILE} isn't
#     there yet, so the direct tap is a no-op; the fallback opens the hamburger drawer
#     (content-desc "Show roots" - present and tappable on BOTH picker apps, confirmed by
#     hierarchy dump on both), taps "Downloads", then finds ${FILE} there.
#   - Tab_30_Nexus7 (API 30, best effort per the task decision): also AOSP `com.android
#     .documentsui`, same "Recent" list as API 26 with ${FILE} already present (this emulator's
#     picker had prior navigation history, same as Tab_26's non-fresh runs) - the direct tap
#     worked here every time this task tried it, with no keyboard workaround needed. The task
#     brief assumed tapOn is ignored on this API level; that was NOT reproduced in this task's
#     testing (Maestro 2.12.1, 2026-11-08) - see task-5-report.md for the full chain's PASS
#     output and the "API 30 status" section before relying on that being fixed for good.
#
# The fallback is gated on `visible: "Show roots"`, not on `notVisible: ${FILE}` alone: after a
# successful direct tap we leave the picker app entirely, so "${FILE}" being no longer visible is
# true in BOTH the "it worked" and "it's on another screen within the picker" cases. Only
# "Show roots" (the picker's own drawer button, confirmed present on its every main screen)
# reliably tells those apart - it disappears once we've left the picker for good.
#
# Fix round 2 (2026-11-08, Task 7a): DocumentsUI remembers which root was last open ACROSS picker
# invocations (its own state, independent of the calling app's clearState), so "Open book" does
# not always land on "Recent" - with many fixtures pushed it was observed opening straight onto
# "Downloads". When that happens, tapping "Downloads" inside the "Show roots" drawer is a tap on
# the ALREADY-selected root: a no-op that leaves the modal drawer open, its scrim still darkening
# and its panel still covering the first grid column(s) - including ${FILE} when it sorts first
# alphabetically - so the immediately-following visibility wait times out even though the file is
# right there, just hidden under the open drawer. Confirmed by a direct on-device repro
# (two-screenshot probe: identical before/after tapping the already-selected "Downloads" row) and
# the fix: "Recent" is a drawer-only row (never part of the main content screen's own filter
# chips), so its continued visibility after tapping "Downloads" means the drawer never closed;
# `back` is standard Android drawer-dismiss behaviour (confirmed on-device: it closes the drawer
# without leaving the picker or losing the Downloads selection) and is safe here precisely because
# it is gated - never fired when the drawer legitimately auto-closed.
#
# Fix round 3 (2026-11-08, Task 7a "Take 1"): with all ~50 fixtures pushed at once (the old
# e2e/run.sh behaviour at the time), the Downloads grid did NOT show ${FILE} in its
# initially-rendered page even when ${FILE} sorted alphabetically first - confirmed on-device:
# MediaStore had it indexed correctly (`content query` returned the right row, right mime/size)
# and a bare `extendedWaitUntil: visible` timed out at 8s, but `scrollUntilVisible` found it a
# few rows down. scrollUntilVisible both waits and scrolls, so it is a strict superset of a
# plain visibility wait (a no-op scroll when the file is already on screen) - kept as the
# general-case primitive here even though round 4's 90s timeout (below) was simplified back
# down in Task 7a "Take 2".
#
# Simplified in Task 7a "Take 2" (2026-11-09): run.sh now pushes only the ONE flow's own `#
# books:` fixtures at a time (at most 13, for J-LIB-03; most flows push far fewer) instead of
# the whole ~50-fixture suite at once, so ${FILE} is reliably within the grid's first screen or
# two - timeout 90000 -> 20000. This is a real reduction in picker-navigation work, not a hidden
# behaviour change: the drawer-dismiss fix above and scrollUntilVisible itself are kept exactly
# as they were (neither was data-volume-dependent), only the generous worst-case timeout needed
# for a ~50-item grid is no longer needed for an at-most-13-item one.
#
# Fix round 5 (2026-11-09, Task 7a "Take 2"): scroll Home back to the top FIRST. Callers of this
# subflow are always on Home, but not always scrolled to the top of it - e.g. after a caller
# scrolled down to check the "Your shelf · N VOLUME(S)" header (which can sit below the fold on
# a phone in portrait - the Continue Reading hero takes enough vertical space), "Open book" (in
# Home's top header) is left above the fold. Confirmed on-device (Pixel_10_Pro/API 37): a bare
# `tapOn: "Open book"` right after such a scroll failed with "Element not found". scrollUntilVisible
# is a no-op when already at/near the top (tablet, or any caller that didn't scroll down), so this
# is safe for every caller, not just the phone/scrolled-down case.
- scrollUntilVisible:
    element: "Open book"
    direction: UP
    timeout: 10000
- tapOn: "Open book"
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 10000
- tapOn:
    text: "${FILE}"
    optional: true
# Fix round 6 (2026-11-11, Take 8, phone pass): replaced the "Recent" visible -> back fallback
# above (kept in the file's history via this comment) with a positive confirmation + retry, after
# confirming on-device (Pixel_10_Pro/API 37) that it actively breaks this picker version: a
# hierarchy dump right after tapping "Downloads" showed BOTH "Show roots" (content-desc) and
# "Recent"/"Recent files" (text) still present together - i.e. on this picker build "Recent" is
# not drawer-only (contradicting this file's own longstanding assumption, confirmed true on
# earlier API levels/picker builds) - so the gating condition was true even with no modal drawer
# open, and the resulting `back` exited the picker ACTIVITY entirely (no drawer left to dismiss),
# landing back on Mirrolit's own Home screen - confirmed via two independent repros
# (`e2e/reports/20261111T082114Z` and `20261111T083458Z`, both failing identically on the
# following `scrollUntilVisible` for ${FILE}, both with a final screenshot of Mirrolit's empty
# Home, and `commands.json` showing `backPressCommand` COMPLETED immediately before it). A
# first-tap-can-lag probe (same device) also showed the FIRST "Downloads" tap sometimes leaves
# the picker still showing the "Recent" root's OWN content (not Downloads') even though the tap
# itself reported COMPLETED - a second tap then correctly switched to "Files in Downloads". The
# fix below waits for the picker's own unambiguous "Files in Downloads" breadcrumb (confirmed
# on-device, present once but only once actually on that root, on both the drawer and the
# newer-tabbed picker builds) and retries the Show-roots-then-Downloads tap once if it doesn't
# show up the first time, instead of ever assuming navigation succeeded or firing an unconditional
# `back`.
# The AOSP picker (PICKER=aosp, Tab_26_Nexus9 / API 26) has no "Files in Downloads" header and
# reopens on the last root: picker_root_aosp.yaml goes to Downloads there. Every other picker: the
# block after it, unchanged.
- runFlow:
    when:
      visible: "Show roots"
      true: ${typeof PICKER !== 'undefined' && PICKER == 'aosp'}
    commands:
      - runFlow:
          file: picker_root_aosp.yaml
          env:
            ROOT: "Downloads"
      - scrollUntilVisible:
          element: "${FILE}"
          direction: DOWN
          timeout: 20000
      - tapOn: "${FILE}"
- runFlow:
    when:
      visible: "Show roots"
      true: ${typeof PICKER === 'undefined' || PICKER != 'aosp'}
    commands:
      - tapOn: "Show roots"
      - extendedWaitUntil:
          visible: "Downloads"
          timeout: 5000
      - tapOn: "Downloads"
      - extendedWaitUntil:
          visible: "Files in Downloads"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            notVisible: "Files in Downloads"
          commands:
            - tapOn: "Show roots"
            - extendedWaitUntil:
                visible: "Downloads"
                timeout: 5000
            - tapOn: "Downloads"
      - extendedWaitUntil:
          visible: "Files in Downloads"
          timeout: 10000
      # Fix round 4 (2026-11-08, Task 7a): timeout raised 15000 -> 90000. With the full ~50-file
      # fixture set pushed (the real e2e/run.sh scenario), DocumentsUI does not show one globally
      # re-sorted grid: the files pushed in run.sh's main e2e/books/* loop list first (already
      # alphabetical, since the shell glob itself is alphabetical), then the e2e/books/fetched/*
      # batch lists as its own alphabetical run appended after ALL of the first batch - confirmed
      # on-device by scrolling through it. So a fixture from the fetched/ batch (e.g.
      # alice-illustrated.epub) can sit roughly 40+ items deep even though its name sorts first
      # overall. 35s still was not always enough on a freshly-booted (not yet warmed up) emulator
      # - observed stopping only a third of the way through the grid at that timeout - so this is
      # raised again, generously, rather than iterated a third time.
      - scrollUntilVisible:
          element: "${FILE}"
          direction: DOWN
          timeout: 20000
      - tapOn: "${FILE}"
