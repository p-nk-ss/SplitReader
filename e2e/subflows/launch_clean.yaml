appId: ${APP_ID}
---
# launch_clean: starts Mirrolit fresh (cleared app state, all runtime permissions
# pre-granted) and waits for the empty library's "Open book" action to appear,
# proving the app is up and Home has rendered.
#
# Timeout 45000 (not 30000): a cold start right after clearState re-runs Hilt/Room/DataStore
# init from scratch with nothing warm, and on a loaded emulator (background Gradle/adb/other
# Maestro activity) this was observed on-device (Task 7a, Tab_35_PixelTablet, 2026-11-08) taking
# noticeably longer than 30s - the first frame renders (empty cream background, status/nav bars
# up) well before "Open book" actually appears, so a plain blank screenshot at a 30s timeout did
# not mean the app was stuck, just still composing Home.
#
# Fix round, Task 7a "Take 2" (2026-11-09): reset the system file picker's (DocumentsUI's) own
# remembered state as well, not just Mirrolit's. Confirmed in Task 7a "Take 1": DocumentsUI
# keeps its own cross-invocation state (last-opened root, and — suspected under heavy repeated
# use — multi-select mode) completely independent of `launchApp: { clearState: true }` above,
# which only clears MIRROLIT's state. A `- clearState: <appId>` command clears another app's
# state the same way `pm clear` does; it is run against BOTH DocumentsUI package names since the
# installed one differs by Android flavour (confirmed via `adb shell pm list packages |
# grep documentsui`: Google APIs images, incl. Tab_35_PixelTablet and Pixel_10_Pro, ship
# `com.google.android.documentsui`; AOSP images, incl. Tab_26_Nexus9, ship
# `com.android.documentsui` instead — never both). `optional: true` on each (not a `when:`
# condition — clearState has no way to test "is this package installed" against on-screen
# state) means clearing the one that ISN'T installed on this device/image is a harmless no-op
# rather than a flow-aborting failure; see e2e/README.md for the verification command.
- clearState:
    appId: com.google.android.documentsui
    optional: true
- clearState:
    appId: com.android.documentsui
    optional: true
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "Open book"
    timeout: 45000
